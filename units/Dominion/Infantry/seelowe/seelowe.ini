[core]

name:seelowe

tags:infantry
displayText: Seelowe 
displayDescription: 

displayText_ru: Сиилов 
displayDescription_ru:

copyFrom: ROOT:Templates\customEffects.template

class: CustomUnitMetadata
price: 600
maxHp: 160
mass: 100
selfRegenRate:0.06

fogOfWarSightRange: 18

isUnrepairableUnit:true

techLevel: 1
buildSpeed: 7s
#availableInDemo: true

radius: 10
displayRadius: 11

isBio: true
softCollisionOnAll: 7

[graphics]
#total_frames: 8

image:        Schuetze.png
image_wreak:  none
image_turret: Schuetze_gun.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


#animation_moving_start: 0
#animation_moving_end: 7
#animation_moving_speed: 2

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=60) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat') and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=500)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 5
turretTurnSpeed: 8


maxAttackRange: 150

turretRotateWithBody: true

shootDelay: 12

[hiddenAction_GoInWater]
buildSpeed:0.5s
autoTriggerCheckRate:every8Frames
autoTrigger:if self.isOverwater()
convertTo:seeloweUnderwater

[turret_1]
#
x: 3
y: 5

projectile: 1

canAttackFlyingUnits: false
canAttackLandUnits:   true

turnSpeedAcceleration: 3.0

shoot_sound:ROOT:sounds\boltRifle_fire_1.wav
shoot_sound_vol:0.20
shoot_flame:small
shoot_light:#ffcc00
canShoot: true

recoilOffset: -1.5
recoilOutTime: 2
recoilReturnTime: 4

[projectile_1]
directDamage: 12
life: 60
speed: 7

frame: 5

lightColor:#ffcc00
lightSize:0.2

drawSize: 0.6

explodeEffect:CUSTOM:bullet_hit

[movement]
movementType: OVER_CLIFF_WATER
moveSpeed: 0.80
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.2

maxTurnSpeed: 10.0
turnAcceleration: 2.0

targetHeight:1
targetHeightDrift:0

moveSlidingMode :true
moveIgnoringBody:true
