[core]
name:seeloweUnderwater
copyFrom:seelowe.ini
showInEditor:false
maxHp: 200
mass: 300
tags:inWater

[graphics]
total_frames: 4

image:        seeloweUnderwater.png
image_wreak:  none
image_turret: none

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 5

splastEffect:true
[turret_1]
#
x: 0
y: 10
canAttackMaxAngle:15

shoot_flame:none
shoot_sound:ROOT:sounds\grenade_fire_1.wav
shoot_sound_vol:0.15
canOnlyAttackUnitsWithTags:inWater

canAttackLandUnits:   true
canAttackUnderwaterUnits: false

[turret_2]
linkDelayWithTurret:1
#
x: 0
y: 10
canAttackMaxAngle:15

shoot_flame:none
shoot_sound:ROOT:sounds\grenade_fire_1.wav
shoot_sound_vol:0.15

canAttackLandUnits:   false
canAttackUnderwaterUnits: true

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true


isFixedFiring: true

turretSize: 8
turretTurnSpeed: 8


maxAttackRange: 200

turretRotateWithBody: true

shootDelay: 60

[hiddenAction_GoOutOfWater]
buildSpeed:0.5s
autoTriggerCheckRate:every8Frames
autoTrigger:if not self.isOverwater()
convertTo:seelowe

[projectile_1]
directDamage:60
areaRadius: 40
areaDamage: 30
drawSize:0.8
life: 180

lightSize:0.0

speed: 0.2
targetSpeed: 2.5
targetSpeedAcceleration: 0.02

frame: 1
image: ROOT:\shared\graphics\small_torpedo.png
hitSound: true

ballistic_delaymove_height: -5.5
ballistic:false
ballistic_height: -10.0
targetGround_includeTargetHeight:true
targetGroundHeightOffset:-15

color:#ffffff
trailEffect:true
trailEffectRate:2.5

[movement]
movementType: HOVER
moveSpeed: 1.0
moveAccelerationSpeed: 0.2
moveDecelerationSpeed: 0.1

maxTurnSpeed: 2.0
turnAcceleration: 0.2

targetHeight:-5
targetHeightDrift:0



moveSlidingMode :true
moveIgnoringBody:false