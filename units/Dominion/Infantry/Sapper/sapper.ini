[core]

name: sapper

showActionsWithMixedSelectionIfOtherUnitsHaveTag:infantry

tags:infantry,radar
displayText: Sapper
displayDescription: -Dominion's sappers\n-lightly armoured and armed with a low caliber rifle\n-primarily used for building fortifications and laying mines, or removing enemy mines\n-Land and Air attack \n-sapper only mistakes once in his career

displayText_ru: Сапёр
displayDescription_ru: Сапёр Доминиона\n-Легко бронирован и легко вооружен малокалиберной винтовкой\n-Используятся для минирования и создания фортификаций, и разминирования\n-Наземная и воздушная атака\n-Сапёр ошибается лишь раз в своей карьере

copyFrom:ROOT:Templates\customEffects.template

#-temporarily disabled
#canRepairUnitsOnlyWithTags:repairable
canReclaimResources: true
class: CustomUnitMetadata
price: 400
maxHp: 120
mass: 100
armour:2
selfRegenRate:0.05

isBuilder: true

nanoRange:100
nanoBuildSpeed: 0.5
nanoRepairSpeed:0.3

canRepairBuildings: true
canRepairUnits : true
isUnrepairableUnit:true

techLevel: 1
buildSpeed: 5s
#availableInDemo: true

radius: 8
displayRadius: 10

autoRepair: true
isBio: true
softCollisionOnAll: 5

[graphics]
total_frames: 8

image:        sapper.png
image_wreak:  none
image_turret: none

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 7
animation_moving_speed: 2

[hiddenAction_repair]
autoTrigger: if not self.hasActiveWaypoint(type='repair') and self.numberOfUnitsInTeam(withTag='retreat', withinRange=300, greaterThan=0)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: retreat
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: repair
allowMultipleInQueue: false

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 5
turretTurnSpeed: 5


maxAttackRange: 150

turretRotateWithBody: true

shootDelay: 13

[turret_1]
#nano turret (nano must be slot 1)
x: 0
y: 0
invisible: true
warmup:30

canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turnSpeedAcceleration: 1.0

[turret_2]
#
x: 0
y: 0

invisible: true
projectile: 1

turnSpeedAcceleration: 1.0

shoot_sound:ROOT:sounds\smg_fire.wav
shoot_sound_vol:0.10
shoot_flame:small
shoot_light:#FFccCCEE

canShoot: true




[projectile_1]
directDamage: 5
life: 60
speed: 7

frame: 5

drawSize: 0.6

explodeEffect:CUSTOM:bullet_hit

[movement]
movementType: LAND
moveSpeed: 0.9
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.2

maxTurnSpeed: 10.0
turnAcceleration: 2.0

moveSlidingMode :true
moveIgnoringBody:true

[canBuild_1]
name: dominion_extractor, barracks, mine, trench_horizontal,trench_vertical,foxhole,tankTrap,howitzer
pos: 1