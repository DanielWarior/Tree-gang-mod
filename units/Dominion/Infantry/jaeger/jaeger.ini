[core]

name:jaeger

tags:infantry
displayText: Jaeger
displayDescription: -Dominion's experienced soldier armed with a high-caliber semi-auto rifle\n-fragile but good dps for cost\n-Have rifle grenades as an ability \n-effective while being covered by trenches or vehicles\n-Can dig their own trenches with their trusty trench shovels, and do basic building repairs\n-Land attack, and weaker air attack

displayText_ru: Егерь
displayDescription_ru: Опытный солдат доминиона вооруженный крупнокалиберной полуавтоматической винтовкой\n-Хрупкий но хороший дпс за свою цену\n-Имеют винтовочные гранаты как способность\n-Эффективен из укрытий или техники\n-Может копать себе окопы сапёрной лопаткой, и производить базовый ремонт строений\n-Наземная, и более слабая воздушная атака

copyFrom:ROOT:Templates\customEffects.template

class: CustomUnitMetadata
price: 500
maxHp: 240
mass: 150
selfRegenRate:0.06

fogOfWarSightRange: 19

techLevel: 2
buildSpeed: 8s
#availableInDemo: true

radius: 10
displayRadius: 12

isBio: true
softCollisionOnAll: 5

nanoRange:120
nanoBuildSpeed: 0.40
nanoRepairSpeed:0.3

canRepairBuildings: true
canRepairUnits : false
isUnrepairableUnit:true
[canBuild_1]
name: trench_horizontal,trench_vertical,foxhole
pos: 0.2 

[graphics]
#total_frames: 8

image:        jaeger.png
image_wreak:  none
image_turret: jaeger_gun.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


#animation_moving_start: 0
#animation_moving_end: 7
#animation_moving_speed: 2

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=170)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=100) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat') and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=500)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 8
turretTurnSpeed: 8

aimOffsetSpread:0.3

maxAttackRange: 200

turretRotateWithBody: true

shootDelay: 20

[turret_2]
#
x: 0.0
y: 0.0
invisible:true
attachedTo:1
#slave:true
projectile: 1

canAttackFlyingUnits: true
canAttackLandUnits:   false

turnSpeedAcceleration: 3.0
shoot_sound:ROOT:sounds\rifle_fire_1.wav
shoot_sound_vol:0.20
shoot_flame:small
shoot_light:#ffcc00
canShoot: true

recoilOffset: -2.5
recoilOutTime: 20
recoilReturnTime: 40
delay:70

canAttackMaxAngle:20

canAttackCondition:if not self.hasTags(includes="noShoot")

[turret_1]
