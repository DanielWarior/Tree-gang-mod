whenBuilding_rotateTo_aimAtActionTarget:true

resetCustomTimer:true
alsoQueueAction:rifleGrenade2
alsoTriggerOrQueueActionWithTarget:thisActionTarget()
temporarilyAddTags:noShoot

[hiddenAction_rifleGrenade2]
fireTurretXAtGround:3
buildSpeed:2s
whenBuilding_cannotMove:true
whenBuilding_rotateTo_aimAtActionTarget:true

[hiddenAction_reset]
autoTrigger:If self.customTimer(laterThanSeconds=2)
temporarilyRemoveTags:noShoot


