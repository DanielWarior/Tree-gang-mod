[core]
copyFrom:ROOT:Templates\customEffects.template
name:panzerhandschuh

tags:infantry
displayText: Panzerhandschuh (S)
displayDescription: -Dominion's trooper armed with a Plasma rocket Launcher, and exo skeleton to support it \n-Rockets have weak homing, and collide with first target they hit\n-fragile and slow but long range \n-land attack, 600 dmg per shot\n-The final Evolution of the Panzershreck

displayText_ru: Панзерхандшун (С)
displayDescription_ru:-Солдат Доминиона вооруженный Плазменной ракетницей и экзо-скелетом что-бы ее использовать\n-У ракет слабая наводки, взрываются при контакте с целью\n-Хрупкий и медленный, но имуют высокую дальность\n-Наземная атака, 600 урона за выстрел\n-Финальная эфолюция панзершрэка

class: CustomUnitMetadata
price: credits=2000, thorium=100
maxHp: 400

mass: 400
selfRegenRate:0.2

fogOfWarSightRange: 28

isUnrepairableUnit:true

techLevel: 3
buildSpeed: 30s
#availableInDemo: true

transportSlotsNeeded:3

radius: 20
displayRadius: 20

isBio: true
softCollisionOnAll: 20

[graphics]
#total_frames: 8

teamColorsOnTurret:true

imageScale:1
#scaleTurretImagesTo:7.3

image:        panzerhandschuh.png
image_wreak:  none
image_turret: panzer_gun.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


#animation_moving_start: 0
#animation_moving_end: 7
#animation_moving_speed: 2

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=235)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 18
turretTurnSpeed: 5


maxAttackRange: 310

turretRotateWithBody: true

shootDelay: 320


[turret_1]
#
x: 4
y: -2

aimOffsetSpread: 0

projectile: dummy

turnSpeedAcceleration: 1.0
canAttackMaxAngle:15
shoot_sound:ROOT:sounds\plasma_rocket.wav
shoot_sound_vol:0.5
shoot_flame:CUSTOM:plasma_fire_medium
shoot_light:#00f2ff
canShoot: true

warmup:30

recoilOffset: -2
recoilOutTime: 5
recoilReturnTime: 8


[projectile_1]
directDamage: 450
areaDamage: 150
areaRadius: 50

life: 90
speed: 2

drawSize: 0.8

targetSpeed: 7
trailEffect: true
trailEffectRate:2

#leadTargetingSpeedCalculation:1

lightSize:2
lightColor:#00f2ff
image:ROOT:shared/graphics/plasma_rocket.png
color:#00f2ff

explodeEffect:smallExplosion
autoTargetingOnDeadTarget:true

turnSpeed:0.30
retargetingInFlight:true
retargetingInFlightSearchDelay:5
retargetingInFlightSearchRange:25
retargetingInFlightSearchLead:0

[leg_1]
x: 5
y: 0.5
attach_x: 3
attach_y: 0
moveSpeed: 1.65
heightSpeed: 1.6
moveWarmUp:2
resetAngle: 15
dust_effect: false

holdDisMin: 0.5
holdDisMax: 6
holdDisMin_maxMovingLegs: 1
estimatingPositionMultiplier: 1.30

image_leg: panzer_leg.png
image_foot: panzer_foot.png
draw_foot_on_top: true
holdDisMin_checkNeighbours:true

hardLimit:42

targetHeight:0
endDirOffset:0
rotateSpeed:6

[leg_2]
@copyFromSection: leg_1
x: -5
y: 0.5
attach_x: -3
attach_y: 0

[projectile_dummy]
life: 1000

directDamage: 0
areaDamage: 0
areaRadius: 0
targetGround:true
#speed value here controlls the prediction distance, despite the dummy projectile being instantm due to it's lifetime being high and checking the speed. It is stupid but it works.
speed: 3.6

instant: true

explodeOnEndOfLife:true
spawnProjectilesOnExplode:1

invisible: false
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.1

maxTurnSpeed: 5.0
turnAcceleration: 2.0

moveSlidingMode :true
moveIgnoringBody:true
