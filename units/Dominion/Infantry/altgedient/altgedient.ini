[core]

name:altgedient

tags:infantry
displayText: Altgedient (B)
displayDescription: -Soldier armed with a laser rifle and armour featuring energy shields and powered exoskeleton\n-Still relativelly fragile, but rapidly restores shield and can cross cliffs thanks to it's armour\n-Has a 10 round magazine, after firing needs to reload\n-Can divert the power from their shields to the weapon, increasing firerate and ammo capacity, but losing shield\n-Land, and weaker air attack

displayText_ru: Ветеран (Б)
displayDescription_ru: -Солдат вооруженный лазерной винтовкой и броней с встроенным генератором щита, и силовым экзоскелетом\n-Всё еще относительно хрупкие, но быстро восстанавливают щиты, и могут пересекать горы благодаря своей броне\n-Имеют магазин на 10 патронов, после стрельбы им требуется перезарядка\n-Могут перевести энергию со своих щитов к оружию, теряя щиты но увеличивая скорострельность и боезапас\n-Наземная, и ослабленная воздушная атака


copyFrom:ROOT:Templates\customEffects.template

class: CustomUnitMetadata
price: credits=1250, thorium=75
maxHp: 200
transportSlotsNeeded:2

energyMax:9
energyNeedsToRechargeToFull:true
energyRegen:0.01
energyRegenWhenRecharging:0.03

maxShield: 300
shieldRegen: 0.3

mass: 500
selfRegenRate:0.2

fogOfWarSightRange: 25

techLevel: 3
buildSpeed: 16s
#availableInDemo: true

radius: 14
displayRadius: 18

isBio: true
softCollisionOnAll: 8


nanoRange:120
nanoBuildSpeed: 1
nanoRepairSpeed:0.5

canRepairBuildings: true
canRepairUnits : false
isUnrepairableUnit:true

[canBuild_1]
name: trench_horizontal,trench_vertical,foxhole
pos: 0.2 

[graphics]
#total_frames: 8

image:        altgedient.png
image_wreak:  none
image_turret: jaeger_gun.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


#animation_moving_start: 0
#animation_moving_end: 7
#animation_moving_speed: 2

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=170)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=100) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat') and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=500)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 8
turretTurnSpeed: 8

aimOffsetSpread:0.3

maxAttackRange: 250

turretRotateWithBody: true

shootDelay: 15

[turret_2]
#
x: 0.0
y: 0.0
invisible:true
attachedTo:1
#slave:true
projectile: 1
energyUsage:1

canAttackFlyingUnits: true
canAttackLandUnits:   false

turnSpeedAcceleration: 3.0
shoot_sound:plasma_fire
shoot_sound_vol:0.20
shoot_flame:small
shoot_light:#ffcc00
canShoot: true

recoilOffset: -2.5
recoilOutTime: 20
recoilReturnTime: 40
delay:70

canAttackMaxAngle:20

canAttackCondition:if not self.hasTags(includes="noShoot")

[turret_1]
#
x: 2.5
y: 5.5

projectile: 1
energyUsage:1

canAttackFlyingUnits: false
canAttackLandUnits:   true

turnSpeedAcceleration: 3.0

shoot_sound:plasma_fire
shoot_sound_vol:0.20
shoot_flame:NONE
shoot_light:#00f2ff
canShoot: true

recoilOffset: -2.0
recoilOutTime: 2
recoilReturnTime: 8

canAttackMaxAngle:20

canAttackCondition:if not self.hasTags(includes="noShoot")

[projectile_1]
# Beam
directDamage: 50

deflectionPower: -1
life: 10
instant: true

beamImageStart:SHARED:beam1_end.png
beamImage: ROOT:shared/graphics/laserSmall.png
beamImageEnd: SHARED:beam1_end.png

moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #00f2ff
lightSize: 0.5

[action_divertPower]
isVisible:if not self.hasFlag(id=1)
text:Power To Weapon
text_ru:Энергию В Оружие

buildSpeed:0.5s
description:Temporarily Divert power to the weapon, giving it full energy and increasing ammo capacity, along with a firerate increase, but lose all shield and shield regen
description_ru:Временно Перевести энергию в оружие, и дать ему полный заряд энергии и размер магазина, также увеличить скорость стрельбы, Но потерять весь щит и его восстановление

pos:0.1
setUnitStats:shieldRegen=0.0, shootDelayMultiplier=0.80, maxEnergy=15, energy=15
addResources:shield=-300, setFlag=1
addAllActionCooldownsTime:21s
alsoQueueAction:divertPowerBack

[hiddenAction_divertPowerBack]
buildSpeed:6s

pos:0.1
setUnitStats:shieldRegen=0.3, shootDelayMultiplier=1, maxEnergy=9, energy=0
addResources:unsetFlag=1

[movement]
movementType: OVER_CLIFF
moveSpeed: 1
moveAccelerationSpeed: 0.2
moveDecelerationSpeed: 0.3

maxTurnSpeed: 10.0
turnAcceleration: 3.0

moveSlidingMode :true
moveIgnoringBody:true
[ai]
ai_upgradePriority:0.30
