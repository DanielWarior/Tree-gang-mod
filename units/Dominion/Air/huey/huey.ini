
[core]
name: huey
class: CustomUnitMetadata
price: 600
maxHp: 300
mass: 900

techLevel: 1
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
displayText: Huey helicopter
displayDescription: -Dominion's mass produced light infatry transport helicopter\n- Can carry 4 infantry units, and unload them on the move \n- units can shoot out of the vehicle

displayText_ru: Вертолёт Хьюй
displayDescription_ru:Пущенный в массовое производство пехотно транспортный вертолёт\n-Может переносить 4 пехотинца и выгружать их на ходу\n-Юниты могут стрелять из техники

transportUnitsUnloadDelayBetweenEachUnit:5

buildSpeed: 11s

copyFrom:ROOT:Templates\customEffects.template

radius: 22
displayRadius:24
isBio: false

maxTransportingUnits: 4
transportUnitsRequireTag:infantry
transportUnitsRequireMovementType: LAND,OVER_CLIFF,HOVER

exit_x:0
exit_y:0

exit_dirOffset:90
exit_moveAwayAmount:30

softCollisionOnAll: 16
fogOfWarSightRange: 18
tags: air


[graphics]
total_frames: 4

image:        huey.png
image_wreak:  huey_wreck.png
image_turret: NONE
imageScale: 1.0
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_idle_start: 0
animation_idle_end: 3
animation_idle_speed: 2

animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 4
maxAttackRange: 180
shootDelay: 30

turretMultiTargeting: true

[arm_1]
x:0
y:4
image_end:huey_blades.png
spinRate:10
drawOverBody:true
image_end_teamColors:true

[arm_2]
x:0.5
y:0
image_end:huey_bottom.png
drawUnderAllUnits:true
drawOverBody:false

[action_land]
isVisible:if not self.hasTags(includes="landed")
text:Land
text_ru:Сесть
setUnitStats:targetHeight=1, moveSpeed=0
temporarilyAddTags:landed
buildSpeed:0.5s
[action_rise]
isVisible:if self.hasTags(includes="landed")
text:Fly
text_ru:Взлететь
setUnitStats:targetHeight=30, moveSpeed=2
temporarilyRemoveTags:landed
buildSpeed:1s
[turret_1]
#
x: 0
y: 18

projectile: 1

size:12
canAttackMaxAngle:15
turnSpeedAcceleration: 1.0

shoot_sound:ROOT:sounds\lmg_fire_1.wav
shoot_sound_vol:0.08
shoot_flame:none
shoot_light:#FFccCCEE

canShoot: true


[projectile_1]
directDamage: 5
life: 60
speed: 8

frame: 5

drawSize: 0.6

explodeEffect:CUSTOM:bullet_hit


[movement]
movementType: air
moveSpeed: 1.8
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.015

targetHeight:30
heightChangeRate:0.8

maxTurnSpeed: 5.5
turnAcceleration: 0.4

moveSlidingMode :true
moveIgnoringBody:true

[attachment_1pas]
x:4
y:6
addTransportedUnits:true
canAttack:true
setDrawLayerOnTop:false
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:true
idleDir:90

[attachment_2pas]
@copyFromSection: attachment_1pas
x:-4
y:-6
idleDir:-90

[attachment_3pas]
@copyFromSection: attachment_1pas
x:4
y:-6
idleDir:90
[attachment_4pas]
@copyFromSection: attachment_1pas
x:-4
y:6
idleDir:-90