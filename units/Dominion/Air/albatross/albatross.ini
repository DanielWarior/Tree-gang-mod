
[core]
name: albatross
class: CustomUnitMetadata
price: 4000
maxHp: 2600
armour:2
mass: 5000

copyFrom:ROOT:Templates\customEffects.template

energyMax: 14
energyRegen: 0.005
energyNeedsToRechargeToFull: true
energyRegenWhenRecharging:0.01

displayText: Albatross(BB)
displayDescription:-Heavy bomber armed with 250 kg bombs for carpet bombing runs(100 damage) \n-armed with 2 mg turrets to fend off enemy air attacks \n-slow but resilient \n- Land and underwater attack \n-x2 building damage

displayText_ru: Альбатрос (ББ)
displayDescription_ru:-Тяжелый бомбардировщик вооруженный 250кг бомбами для ковровых бомбардировок.(100 урона)\n-Вооружен 2 пелемётными турелями для защиты от перехватчиков\n-медленный но крепкий\n-2x урон по строениям

techLevel: 2
buildSpeed: 45.0s

radius: 32
displayRadius:36
isBio: false

softCollisionOnAll: 22

fogOfWarSightRange: 13

tags: air

[graphics]
total_frames: 3
drawLayer:air
animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 0.5

#New sprite by harkius, all hail harkius
image:        albatross.png
image_wreak:  albatross_wreck.png
image_turret: albatross_turret.png

imageScale:1.0

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[hiddenAction_energyParity]
autoTrigger:if attachment(slot="bombBay").energy() < 2
setUnitStats:energy = 1

[hiddenAction_energyParity2]
autoTrigger:if attachment(slot="bombBay").energy() > 13.8
setUnitStats:energy = 14


[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
attackMovement: bomber
turretSize: 20
turretTurnSpeed: 1.5
maxAttackRange: 500
shootDelay: 6
turretMultiTargeting:true

[turret_1]
x: 0
y: 0
invisible: true
shoot_flame: NONE

canShoot: true

limitingRange:100
delay:30
projectile: dummy
size: 6
turnSpeed: 20
canAttackMaxAngle:181
energyUsage:1

[turret_retreatDistance]
x: 0
y: 0
invisible: true
shoot_flame: NONE
canShoot:true
limitingRange:500
projectile:dummy
delay:120

[attachment_bombBay]
x:0
y:0
onCreateSpawnUnitOf:albatross_bombBay

[attachment_turret_1]
x:0
y:-50
onCreateSpawnUnitOf:albatross_turret
setDrawLayerOnTop:true

[attachment_turret_2]
x:0
y:8
onCreateSpawnUnitOf:albatross_turret_2
setDrawLayerOnTop:true

[projectile_dummy]
life: 1

directDamage: 0
areaDamage: 0
areaRadius: 0

speed: 1
instant: false

invisible: true
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false

[movement]
movementType: AIR
moveSpeed: 1
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.5
reverseSpeedPercentage:0.0
landOnGround: onlyIdle


maxTurnSpeed: 2.25
turnAcceleration: 0.07

moveSlidingMode :true
moveIgnoringBody:false


targetHeight:80
heightChangeRate:0.7

slowDeathFall: true
