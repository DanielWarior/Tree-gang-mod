
[core]
copyFrom:ROOT:Templates\customEffects.template
name: joule

displayText: Joule HoverTank (AS)
displayDescription: -Heavy Hover cushion tank "Joule" equipped with a Railgun with EMP payload \n-Completelly ignores Shield, AOE damage \n-reduced damage to buildings\n-Land, Underwater and Air attack

displayText_ru: ХоверТанк Джоуль (ПЩ)
displayDescription_ru: -Тяжелый Танк на воздушной подушке "Джоуль" Экипирован Рельсотроном с ЕМИ зарядом \n-Полностью игнорирует щиты, АОЕ урон \n-Уменьшенный урон по строениям\n-Воздушная, Подводная и наземная атака

class: CustomUnitMetadata
price: credits=4000, thorium=220
maxHp: 2000
maxShield:500
shieldRegen:0.05
armour:3

mass: 3000

techLevel: 3
buildSpeed: 45.0s
#availableInDemo: true

fogOfWarSightRange: 20

radius: 28
displayRadius: 30

isBio: false
softCollisionOnAll: 0


[graphics]
total_frames: 3

teamColorsOnTurret: true
image:        joule.png
image_wreak:  joule_wreck.png
image_turret: joule_turret_base.png

image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2


animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2

animation_idle_start: 0
animation_idle_end: 2
animation_idle_speed: 5

splastEffect: true
dustEffect: true

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=150)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=350) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true

turretSize: 12
turretTurnSpeed: 4

maxAttackRange: 280

shootDelay: 110

[turret_2]
#
image:joule_turret_barrel.png
x: 0
y: 8
attachedTo:1
slave:true

projectile: 1
warmup:20

recoilOffset: -5
recoilReturnTime: 0.30s

turnSpeed: 3
barrelY: 25

canShoot: true

shoot_sound:ROOT:sounds\railgun_fire_1.wav
shoot_sound_vol:0.35
shoot_flame:small

chargeEffectImage: SHARED:lighting_charge.png

[turret_1]
x: 0
y: -10
projectile: 1
canShoot:false


[projectile_1]
directDamage: 125
areaDamage:125
areaRadius:80
life: 140

speed:20

shieldDamageMultiplier: 0.0
shieldDefectionMultiplier:0.0

buildingDamageMultiplier: 0.4

drawSize:1.0
lightColor: #00ffd7
lightSize: 3.0
color:#0086ff
image: ROOT:shared\graphics\shell.png

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8, CUSTOM:sparks2*4, fulgor_explosion
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash, CUSTOM:sparks2*4, fulgor_explosion

areaHitAirAndLandAtSameTime:true
areaHitUnderwaterAlways:true
[movement]
movementType: HOVER
moveSpeed: 1.0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.04

targetHeight:5
targetHeightDrift:1
reverseSpeedPercentage:0.5

maxTurnSpeed: 3.0
turnAcceleration: 0.6

moveSlidingMode :true
moveIgnoringBody:true





