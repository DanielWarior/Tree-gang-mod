
[core]
copyFrom:ROOT:Templates\customEffects.template
name: champion

displayText: Champion CV
displayDescription:-High-tech Combat Vehicle "Champion" \n-armed with a coil gun and missiles\n-ground attack

displayText_ru: Чемпион БМ
displayDescription_ru:-Высокотехнологичная боевая машина "Чемпион"\n-Вооружен гаусс пушкой и ракетницой\n-Наземная атака

class: CustomUnitMetadata
price: credits=1800, thorium=100
maxHp: 1100
mass: 3500
armour:4

techLevel: 3
buildSpeed: 25s
#availableInDemo: true

radius: 22
displayRadius: 22

isBio: false
softCollisionOnAll: 0

fogOfWarSightRange: 18

[graphics]
total_frames: 3
showShotDelayBar:false
teamColorsOnTurret: true
image:        champion.png
image_wreak:  champion_wreck.png
image_turret: champion_turret_base.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_idle_start: 1
animation_idle_end: 1
animation_idle_speed: 1

animation_moving_start: 1
animation_moving_end: 2
animation_moving_speed: 1


dustEffect: true

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=200) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 5


maxAttackRange: 200
shootDelay: 15

[turret_1]
x: 0
y: 0
projectile: dummy
canShoot:true
limitingRange:280
delay:300

invisible:true

[turret_2]
x: 0
y: 0
projectile: dummy
canShoot:true
delay:300

invisible:true

[projectile_dummy]
life: 1

directDamage: 0
areaDamage: 0
areaRadius: 0

speed: 1
instant: false

invisible: true
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false

[attachment_gun]
x: 0
y: 0
onCreateSpawnUnitOf: champion_turret
isUnselectable: true
deattachIfWantingToMove: false
rotateWithParent: true
resetRotationWhenNotAttacking: true
prioritizeParentsMainTarget: true
canBeAttackedAndDamaged:false
setDrawLayerOnTop:true


[movement]
movementType: LAND
moveSpeed: 1.30
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.4
reverseSpeedPercentage:0.6

maxTurnSpeed: 4.0

moveSlidingMode :false
moveIgnoringBody:false

[ai]
buildPriority:0.7