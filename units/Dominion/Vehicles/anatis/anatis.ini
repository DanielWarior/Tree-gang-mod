
[core]
name: anatis
class: CustomUnitMetadata
price: 1500
maxHp: 1600
armour:2
mass: 9000

techLevel: 2

displayText: Anatis (IT)
displayDescription: -Infantry combat vehicle "Anatis" \n-Can carry 4 infantry units\n-The infantry shoots out of the vehicle, and gets it's range\n-can swim, but is slower in water\n-lightly armed, land attack

displayText_ru: Анатис (ТП)
displayDescription_ru:-Боевая машина Пехоты "Анатис"\n-Может перевозить до 4 пехотинцев\n-Пехота может стрелять из техники, И получают её дальность\n-Способна плавать, но медленнее в воде\n-Легко вооружен, Наземная атака

buildSpeed: 20s

radius: 19
displayRadius: 22

isBio: false
softCollisionOnAll: 16

maxTransportingUnits: 4

transportUnitsKillOnDeath: if self.isOverLiquid()
transportUnitsRequireMovementType: LAND,OVER_CLIFF
transportUnitsRequireTag:infantry,crew

transportUnitsUnloadDelayBetweenEachUnit:5

exit_x:20
exit_y:15

exit_dirOffset:90
exit_moveAwayAmount:30

fogOfWarSightRange: 15

[graphics]
total_frames: 3

image:        anatis.png
image_wreak:  anatis_wreck.png
image_turret: anatis_gun.png

image_shadow: AUTO
shadowOffsetX:-1
shadowOffsetY:-1

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2

splastEffect: true
dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 8
maxAttackRange: 230
shootDelay: 9
turretMultiTargeting: true

isFixedFiring:false
aimOffsetSpread:0

[turret_1]
x: 4.5
y: 10

projectile:1

shoot_sound:gun_fire
shoot_sound_vol:0.25
shoot_flame:small
shoot_light:#FFccCCEE

recoilOffset: -1
recoilOutTime: 2
recoilReturnTime: 3

canAttackMaxAngle:40
limitingAngle:75
[projectile_1]
directDamage: 5
life: 70
speed: 8

drawSize:0.7
frame: 1
lightColor: #ff8600
lightSize: 0.4

[movement]
movementType: HOVER
moveSpeed: 1.2
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.4
reverseSpeedPercentage:0.9

maxTurnSpeed: 3.5



moveSlidingMode :false
moveIgnoringBody:false
targetHeight:3

[hiddenAction_movementOnWater]
autoTrigger: if self.overWater()
setUnitStats: moveSpeed = 0.6, targetHeight=0

[hiddenAction_movementOutOfWater]
autoTrigger: if not self.overWater()
setUnitStats: moveSpeed = 1.2, targetHeight=3

[attachment_1pas]
x:-5
y:3
addTransportedUnits:true
canAttack:true
setDrawLayerOnTop:true
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:false
prioritizeParentsMainTarget:true
keepAliveWhenParentDies:false

alwaysAllowedToAttackParentsMainTarget:true
[attachment_2pas]
@copyFromSection: attachment_1pas
x:5
y:3


[attachment_3pas]
@copyFromSection: attachment_1pas
x:-5
y:-9


[attachment_4pas]
@copyFromSection: attachment_1pas
x:5
y:-9



