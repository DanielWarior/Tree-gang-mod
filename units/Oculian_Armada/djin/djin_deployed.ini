
[core]
name: djin_deployed
displayText: Djin deployed
displayDescription: -Oculian mobile gateway for land forces, capable of crossing water and cliffs. \n-needs to lay down a beacon, then deploy over flat solid ground to function\n-Once deployed can rapidly transport units from beacon to itself\n-Unarmed, once deployed charges up extra shield over time.  
class: CustomUnitMetadata
price: 3500
maxHp: 250
maxShield: 800
startShieldAtZero:true
shieldRegen: 0.2
mass: 300000
techLevel: 2
buildSpeed: 40s
radius: 40
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
tags: shield,djinDeployed
showActionsWithMixedSelectionIfOtherUnitsHaveTag:djin
isBuilding:true
disableAllUnitCollisions:true
showInEditor:false
[graphics]
total_frames: 4

animation_idle_start: 0
animation_idle_end: 3
animation_idle_speed: 7

animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 7

image: djin_deployed.png
image_wreak: djin_wreck.png
image_turret: NONE
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
drawLayer:bottom

[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 10000

[action_undeploy]
isVisible:true
text:Undeploy
description:Revert to mobile state
text_ru:Свернуть
description_ru:Вернуть в мобильное состояние
price:0
buildSpeed:3s
addActionCooldownTime:5s
allowMultipleInQueue: false
whenBuilding_cannotMove: true
convertTo:djin
clearAllWaypoints: true
whenBuilding_playAnimation:undeploy

[arm_1]
hidden:false
x:-12
y:-11
image_end:djin_deployed_part.png
drawOverBody:true
drawDirOffset:-180
[arm_2]
hidden:false
x:12
y:-12
image_end:djin_deployed_part.png
drawOverBody:true
drawDirOffset:90

[arm_3]
hidden:false
x:12
y:11
image_end:djin_deployed_part.png
drawOverBody:true
drawDirOffset:0

[arm_4]
hidden:false
x:-12
y:11
image_end:djin_deployed_part.png
drawOverBody:true
drawDirOffset:270

[animation_undeploy]
arm1_1s:{dir:180}

arm2_0.5s:{dir:0}
arm2_1.5s:{dir:-180}


arm3_1s:{dir:0}
arm3_2s:{dir:180}


arm4_1.5s:{dir:0}
arm4_2.5s:{dir:-180}
arm4_4.0s:{dir:-180}


[hiddenAction_die]
autoTriggerOnEvent:destroyed
temporarilyAddTags:removeBeacon

[movement]
movementType: NONE
targetHeight: 1
targetHeightDrift: 0