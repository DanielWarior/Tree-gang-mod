[core]
name: beacon_active
displayText: Beacon Active
displayDescription:beacon of a djin, load units into it to teleport to the djin that placed it.
showInEditor:false
copyFrom:beacon.ini

maxTransportingUnits: 4
transportUnitsRequireMovementType: LAND, OVER_CLIFF, HOVER, OVER_CLIFF_WATER
transportUnitsBlockAirAndWaterUnits: false
transportUnitsBlockOtherTransports: false
transportUnitsAddUnloadOption: true
transportUnitsKillOnDeath: false
exit_moveAwayAmount: 60
exit_y: 60

[hiddenAction_Activate]
autoTrigger:if memory.teleportTarget.hasTags(includes="djin")
convertTo:beacon

[graphics]
image:beacon_deployed.png
imageScale:1.2

total_frames: 4

animation_idle_start: 0
animation_idle_end: 3
animation_idle_speed: 7

animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 7