
[core]
name: djin
displayText: Djin
displayDescription: -Oculian mobile gateway for land forces, capable of crossing water and cliffs. \n-needs to lay down a beacon, then deploy over flat solid ground to function\n-Once deployed can rapidly transport units from beacon to itself\n-Unarmed, once deployed charges up extra shield over time.  
class: CustomUnitMetadata
price: 3500
maxHp: 250
maxShield: 400
shieldRegen: 0.15
mass: 300
techLevel: 2
buildSpeed: 32s
radius: 32
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
tags: shield,djin
showActionsWithMixedSelectionIfOtherUnitsHaveTag:djin
transportSlotsNeeded: 6

[graphics]
total_frames: 1
image: djin.png
image_wreak: djin_wreck.png
image_turret: NONE
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true

[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 10000

[action_deploy]
isVisible:true
isLocked:if self.isOverLiquid() or self.isOverCliff
isLockedMessage:High humidity or terrain prevents the teleporter from working
isLockedMessage_ru:Высокая влажность или ландшафт мешает работе телепорта
text:Deploy
description:Deploy the gate to allow teleporting from the beacon to itself
text_ru:Развернуть
description_ru:Разложить врата для обеспечения телепортации от маяка к юниту
price:0
buildSpeed:3s
addActionCooldownTime:5s
allowMultipleInQueue: false
whenBuilding_cannotMove: true
convertTo:djin_deployed
clearAllWaypoints: true
whenBuilding_playAnimation:deploy

[animation_deploy]
arm1_1s:{dir:180}

arm2_0.5s:{dir:0}
arm2_1.5s:{dir:-180}


arm3_1s:{dir:0}
arm3_2s:{dir:180}


arm4_1.5s:{dir:0}
arm4_2.5s:{dir:-180}
arm4_4.0s:{dir:-180}

[action_dropBeacon]
text:Drop a beacon
temporarilyAddTags:removeBeacon
description:Drop a beacon that will teleport units to this djin, only 1 beacon can exist at a time per djin.
buildSpeed:1.5s
spawnUnits:beacon
alsoQueueAction:tag
addActionCooldownTime:5s

[hiddenAction_tag]
buildSpeed:0.5s
temporarilyRemoveTags:removeBeacon

[hiddenAction_die]
autoTriggerOnEvent:destroyed
temporarilyAddTags:removeBeacon

[arm_1]
hidden:false
x:-11
y:-11
image_end:djin_part.png
drawOverBody:true

[arm_2]
hidden:false
x:11
y:-12
image_end:djin_part.png
drawOverBody:true
drawDirOffset:-90

[arm_3]
hidden:false
x:11
y:11
image_end:djin_part.png
drawOverBody:true
drawDirOffset:-180

[arm_4]
hidden:false
x:-11
y:11
image_end:djin_part.png
drawOverBody:true
drawDirOffset:-270

[movement]
movementType: OVER_CLIFF_WATER
targetHeight: 6
targetHeightDrift: 2
moveSpeed: 0.6
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.05
maxTurnSpeed: 2
turnAcceleration: 2.5
moveSlidingMode :true
moveIgnoringBody:true