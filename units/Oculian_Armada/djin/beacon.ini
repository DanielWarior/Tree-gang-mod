[core]
name: beacon
displayText: Beacon
displayDescription:beacon of a djin, load units into it to teleport to the djin that placed it.
class: CustomUnitMetadata
price: 0
maxHp: 250
mass: 9000
techLevel: 2
buildSpeed: 0.0004
showInEditor: false
isBuilding:true
tags:beacon
radius:25

@memory teleportTarget:unit

[hiddenAction_setTeleportTarget]
autoTriggerOnEvent:created
setUnitMemory:teleportTarget = self.customTarget1
resetCustomTimer:true

[hiddenAction_Activate]
autoTrigger:if memory.teleportTarget.hasTags(includes="djinDeployed")
convertTo:beacon_active

[hiddenAction_kys]
autoTrigger:if self.customTimer(laterThanSeconds=2) and memory.teleportTarget.hasTags(includes="removeBeacon")
setUnitStats:hp=-500

[attachment_1]
x: 0
y: 0
idleDir: 0
isVisible: true
addTransportedUnits:true

[attack]
canAttack:false

[graphics]
image:goby.png

[movement]
movementType:NONE