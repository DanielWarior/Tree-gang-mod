
[core]
name: orchid
displayText: Orchid
displayDescription: -Oculian Hover Elite Beam Artillery \n-Equipped with a larger beam mount alongside 2 smaller ones \n-1x Retina (27 DPS 360 Range\150% Hull Damage\75% Shield Damage\300% Building Damage)\n-2x Tina (13 DPS 360 Range\150% Hull Damage\75% Shield Damage\300% Building Damage)
class: CustomUnitMetadata
price: 3000
maxHp: 300
maxShield: 400
shieldRegen: 0.075
mass: 500
techLevel: 2
buildSpeed: 28s
radius: 18
isBio: false
softCollisionOnAll: 2
fogOfWarSightRange: 22
tags: shield
transportSlotsNeeded: 2



[graphics]
total_frames: 1
image: orchid.png
image_wreak: orchid_dead.png
image_turret: ROOT:\shared\graphics\retina.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 360
shootDelay: 0.15s



[hiddenAction_flee]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=330)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue:false



