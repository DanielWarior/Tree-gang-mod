
[core]
name: bivalve
displayText: Bivalve (AA)
displayDescription: -Oculian Hover T3 AA Unit \n-A much stronger version of Mussel, sports a Glistal that can hit from much farther. \n-1x Glistal (AA) (240 DPS 400 Range) \n-4x Gleam (AA) (480 DPS 300 Range)
class: CustomUnitMetadata
price: 7500
maxHp: 2000
maxShield: 1000
shieldRegen: 0.1
mass: 500
techLevel: 3
buildSpeed: 24s
radius: 26
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 23



[graphics]
