
[core]
overrideAndReplace:heavyHoverTank

name: dwarf
displayText: Dwarf
displayDescription: -Oculian Heavy Assault Hover Unit \n-Heavily armoured and armed with 2 pixies and a spaceship grade plasma battery, along with 4 glints as Anti air\n-1x Nicor (360 DPS 200 Range), n-2x fairy (160 DPS 200 Range), n-4x glint(80 DPS,180 Range)
class: CustomUnitMetadata
price: credits=10000, crystal=450
maxHp: 6000
armour:6
maxShield: 2000
shieldRegen: 0.3
mass: 10000
techLevel: 3
buildSpeed: 65s

radius: 35
displayRadius:45
shieldRenderRadius:40

isBio: false
softCollisionOnAll: 1
fogOfWarSightRange: 20
transportSlotsNeeded: 2



[graphics]
total_frames: 1
image: dwarf.png
image_wreak: gnome_dead.png
image_turret: NONE
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 220
shootDelay: 1.4s



[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=180)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=875) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat



[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false



[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

