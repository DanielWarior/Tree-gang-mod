
[core]
name: baha
displayText: Baha
displayDescription: -Oculian Hover Capture Unit \n-INSERT DESCRIPTION HERE
class: CustomUnitMetadata
price: 1000
maxHp: 1000
maxShield: 1000
shieldRegen: 0.2
mass: 200
techLevel: 1
buildSpeed: 1s
radius: 12
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 20
tags: capturer
@memory captureUnit:unit
@memory captureArray:unit[]

[resource_capturedAmount]
hidden:true

[graphics]
total_frames: 1
image: baha.png
image_wreak: baha_dead.png
image_turret: ROOT:\shared\graphics\tina.png
lock_body_rotation_with_main_turret: true
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: true
canOnlyAttackUnitsWithoutTags: building, capturer, captured
maxAttackRange: 300
shootDelay: 0.10s




[hiddenAction_finishCapture]
autoTriggerOnEvent: newMessage(withTag="capturing")
setUnitMemory: captureUnit = eventSource, captureArray[0]=eventSource
addResources:capturedAmount=1
sendMessageTo: eventSource
sendMessageWithTags: captured

debugMessage: [action log] %{self} successfully captured %{memory.captureParent}


[hiddenAction_loseCapture]
autoTriggerOnEvent: newMessage(withTag="captureDied")
addResources:capturedAmount=-1

[turret_1]
x: 0
y: 0
idleDir:0
projectile: beam
turnSpeed: 4
barrelY: 7

#how many max enemies it can have
canAttackCondition:if self.resource(type="capturedAmount") < 8

[projectile_beam]
directDamage: 0
deflectionPower: -1
life: 15
instant: true
instantReuseLast: true
beamImage: ROOT:shared\graphics\captureBeam.png
beamImageEnd: SHARED:beam1_end.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #ff285a
sweepOffset: 3
sweepSpeed: 5
alwaysVisibleInFog:true
tags: baha



[attachment_1]
x: 0
y: 0
idleDir: 0
isVisible: false
onCreateSpawnUnitOf: baha_marker
isUnselectable: true
deattachIfWantingToMove: false
rotateWithParent: true
resetRotationWhenNotAttacking: true

[movement]
movementType: HOVER
targetHeight: 4
targetHeightDrift: 1
moveSpeed: 1
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.05
maxTurnSpeed: 4
turnAcceleration: 2.5
moveSlidingMode:true
moveIgnoringBody: false