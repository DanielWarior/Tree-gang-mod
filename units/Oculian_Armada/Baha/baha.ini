
[core]
name: baha
displayText: BAHA
displayDescription: -Oculian Hover Capture Unit \n-Special oculian unit that can controll up to 8 enemy units at a time(not buildings) \n-needs to reload after each capture \n- Units break free upon the controlling one dying, or after 30 seconds pass \n-Capture speed depends on the amount of total hp and shield of unit being captured \n- *Noises of getting backdoored*

displayText_ru: БАХА
displayDescription_ru: -Окулианский Ховер захватчик \n-Особый юнит окулиан что может контролировать до 8 вражеских юнитов за раз(Не строения) \n-Перезаряжается после каждого захвата \n-Юниты освобождаются если захватчик умирает, и через 30 секунд\n-Скорость захвата зависит от общего количества хп и щита у захвачиваемого юнита\n-*Звуки захода в тузы*

class: CustomUnitMetadata
price: credits=7000, crystal=320
maxHp: 500
maxShield: 1000
shieldRegen: 0.2
mass: 200
techLevel: 3
buildSpeed: 44s
radius: 12
isBio: false
softCollisionOnAll: 5
fogOfWarSightRange: 20
tags: capturer
@memory pendingCaptureUnit:unit
@memory captureUnit1:unit
@memory captureUnit2:unit
@memory captureUnit3:unit
@memory captureUnit4:unit
@memory captureUnit5:unit
@memory captureUnit6:unit
@memory captureUnit7:unit
@memory captureUnit8:unit

#dictates reload speed
energyMax:5
energyRegen:0.01

[hiddenAction_Reload]
autoTriggerOnEvent: newMessage(withTag="capturing")
addResources:energy=-5

[graphics]
total_frames: 1
image: baha.png
image_wreak: baha_dead.png
image_turret: ROOT:\shared\graphics\tina.png
lock_body_rotation_with_main_turret: true
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: if not self.tags(includes='capturing')
canAttackUnderwaterUnits: if not self.tags(includes='capturing')
canOnlyAttackUnitsWithoutTags: building, capturer
maxAttackRange: 300
shootDelay: 0.10s



[hiddenAction_recapture]
autoTrigger: if not (memory.captureUnit1.hp(greaterThan=0) and memory.captureUnit2.hp(greaterThan=0) and memory.captureUnit3.hp(greaterThan=0) and memory.captureUnit4.hp(greaterThan=0) and memory.captureUnit5.hp(greaterThan=0) and memory.captureUnit6.hp(greaterThan=0) and memory.captureUnit7.hp(greaterThan=0) and memory.captureUnit8.hp(greaterThan=0))
temporarilyRemoveTags: capturing



[hiddenAction_max]
autoTrigger: if memory.captureUnit1.hp(greaterThan=0) and memory.captureUnit2.hp(greaterThan=0) and memory.captureUnit3.hp(greaterThan=0) and memory.captureUnit4.hp(greaterThan=0) and memory.captureUnit5.hp(greaterThan=0) and memory.captureUnit6.hp(greaterThan=0) and memory.captureUnit7.hp(greaterThan=0) and memory.captureUnit8.hp(greaterThan=0)
temporarilyAddTags: capturing



[hiddenAction_finishCapture]
autoTriggerOnEvent: newMessage(withTag="capturing")
setUnitMemory: pendingCaptureUnit = eventSource
sendMessageTo: eventSource
sendMessageWithTags: captured
debugMessage: [action log] %{self} successfully captured %{memory.pendingCaptureUnit}
alsoTriggerAction: setting1, setting2, setting3, setting4, setting5, setting6, setting7, setting8



[hiddenAction_setting1]
alsoTriggerAction: set1
alsoTriggerOrQueueActionConditional: if (memory.captureUnit1==null)



[hiddenAction_set1]
setUnitMemory: captureUnit1 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit1} to 1



[hiddenAction_setting2]
alsoTriggerAction: set2
alsoTriggerOrQueueActionConditional: if (memory.captureUnit2==null)



[hiddenAction_set2]
setUnitMemory: captureUnit2 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit2} to 2



[hiddenAction_setting3]
alsoTriggerAction: set3
alsoTriggerOrQueueActionConditional: if (memory.captureUnit3==null)



[hiddenAction_set3]
setUnitMemory: captureUnit3 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit3} to 3



[hiddenAction_setting4]
alsoTriggerAction: set4
alsoTriggerOrQueueActionConditional: if (memory.captureUnit4==null)



[hiddenAction_set4]
setUnitMemory: captureUnit4 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit4} to 4



[hiddenAction_setting5]
alsoTriggerAction: set5
alsoTriggerOrQueueActionConditional: if (memory.captureUnit5==null)



[hiddenAction_set5]
setUnitMemory: captureUnit5 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit5} to 5



[hiddenAction_setting6]
alsoTriggerAction: set6
alsoTriggerOrQueueActionConditional: if (memory.captureUnit6==null)



[hiddenAction_set6]
setUnitMemory: captureUnit6 = memory.pendingCaptureUnit, pendingCaptureUnit = null
debugMessage: [action log] %{self} set %{memory.captureUnit6} to 6



[hiddenAction_setting7]
