[hiddenAction_lost1]
autoTrigger: if not memory.captureUnit1.hp(greaterThan=0) or memory.captureUnit1.teamId != self.teamId
setUnitMemory: captureUnit1 = null



[hiddenAction_lost2]
autoTrigger: if not memory.captureUnit2.hp(greaterThan=0) or memory.captureUnit2.teamId != self.teamId
setUnitMemory: captureUnit2 = null



[hiddenAction_lost3]
autoTrigger: if not memory.captureUnit3.hp(greaterThan=0) or memory.captureUnit3.teamId != self.teamId
