[turret_1]
x: 0
y: 0
idleDir:0
projectile: beam
turnSpeed: 4
barrelY: 7
canAttackCondition:if self.energy() >= 4.9
canAttackMaxAngle:15

[projectile_beam]
directDamage: 1
deflectionPower: -1
life: 15
instant: true
instantReuseLast: true
beamImage: ROOT:shared\graphics\captureBeam.png
beamImageEnd: ROOT:shared\graphics\captureBeamEnd.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #ff285a
sweepOffset: 3
sweepSpeed: 5
alwaysVisibleInFog:true
tags: baha

teamColorRatio:0.8

[attachment_1]
