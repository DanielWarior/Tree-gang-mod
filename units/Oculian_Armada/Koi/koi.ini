
[core]
overrideAndReplace:mechLaser

name: koi
displayText: Koi
displayDescription: -Oculian Hover Crystalline Skirmish Unit \n-Skirmish hover unit fitted with a Crystalline core, giving it a strong shield and larger range than usual. \n-Has a Lidar array ability, allowing it to attack from further with a buffed firerate, but reduces it's speed and only enables Shiredain to shoot. \n-1x Shiredain (35 DPS 250 Range) \n-2x Fouette (80 DPS 250 Range)
class: CustomUnitMetadata
price: 2500
maxHp: 200
maxShield: 800
shieldRegen: 0.25
energyMax: 300
energyStartingPercentage: 0
mass: 300
techLevel: 2
buildSpeed: 25s
radius: 20
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 19

tags: shield,koi
showActionsWithMixedSelectionIfOtherUnitsHaveTag:koi



[graphics]
total_frames: 1
image: koi.png
image_wreak: koi_dead.png
image_turret: ROOT:\shared\graphics\shiredain.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true
showEnergyBar: false



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 250
shootDelay: 3.25s
turretMultiTargeting:true



[action_lidararray]
iconImage:ROOT:\shared\graphics\lidar_barrage.png
text: Lidar Array
description: -Increases firerate by 200%, increases range by 50% and reduces unit speed to 25% \n-Has a long windup and can't shoot while in it \n-Shiredain is the only active weapon \n-19s Cooldown
buildSpeed: 0.25s
addActionCooldownTime: 19s
temporarilyAddTags: windup
resetCustomTimer: true
alsoTriggerAction: target
addEnergy: 300
setUnitStats: maxAttackRange = 375, moveSpeed = 0.225



[hiddenAction_target]
buildSpeed: 0.75s
fireTurretXAtGround: targetting
fireTurretXAtGround_withOffset: 0, 375
alsoQueueAction: target
alsoTriggerOrQueueActionConditional: if not self.customTimer(laterThanSeconds=2)



[hiddenAction_windup]
autoTrigger: if self.customTimer(laterThanSeconds=2, withinSeconds=2.2) and self.tags(includes='windup')
playSoundAtUnit: ROOT:sounds\Oculian_Armada\lidar_array_windup.ogg



[hiddenAction_transform]
autoTrigger: if self.customTimer(laterThanSeconds=3) and self.tags(includes='windup')
convertTo: koi_buff



