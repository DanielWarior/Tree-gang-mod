
[core]
name: core
displayText: Core
displayDescription: -Oculian Warp Air Transport \n-Transports up to 4 units, requires to stop moving to drop\n-Has a short teleport ability \n-Strong shield for cost
class: CustomUnitMetadata
price: 1800
maxHp: 200
maxShield: 400
shieldRegen: 0.2
mass: 50
techLevel: 2
buildSpeed: 14s
radius: 15
displayRadius: 15
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
tags: air
maxTransportingUnits: 4
transportUnitsCanUnloadUnits:if not self.isMoving()
exit_x:0
exit_y:0



[graphics]
total_frames: 1
image: core.png
image_wreak: core_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1



[attack]
canAttack: false
maxAttackRange: 150

[action_warp]
text:Warp
description:Teleport a short distance in designated spot
buildSpeed:10
fireTurretXAtGround:1
addActionCooldownTime:15s

[turret_1]
x:0
y:0
canShoot:false
[projectile_1]
instant:true
life:30
directDamage:0
teleportSource:true
explodeOnEndOfLife:true
explodeEffect:NONE

[hiddenAction_cargo]
autoTrigger:if self.transportingCount(greaterThan=0)
setUnitStats:moveSpeed=1.50

[hiddenAction_nocargo]
autoTrigger:if self.transportingCount(lessThan=1)
resetUnitStats:true

[movement]
movementType: AIR
targetHeightDrift: 1
moveSpeed: 2.0
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.03
reverseSpeedPercentage: 0
maxTurnSpeed: 1.6
turnAcceleration: 1
moveSlidingMode :true
moveIgnoringBody: true
slowDeathFall: true