
[core]
name: barnacle
displayText: Barnacle
displayDescription: -Oculian Anti-Shield Skirmisher Unit \n-Hover unit that can safely kite against slower units, also effective against shielded units. Can also attack underwater units. \n-1x shecina (60 dps, 300 range\400% shield damage\25% building damage)
class: CustomUnitMetadata
price: 2000
maxHp: 400
maxShield: 100
shieldRegen: 0.05
mass: 300
techLevel: 2
buildSpeed: 22s
radius: 18
isBio: false
softCollisionOnAll: 5
fogOfWarSightRange: 15



[graphics]
total_frames: 1
image: barnacle.png
image_wreak: barnacle_dead.png
image_turret: ROOT:\shared\graphics\shena.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: true
maxAttackRange: 300
shootDelay: 1.5s



[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=180)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=200) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat



[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false



[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat



