#----------
[hiddenAction_shieldRegenOn]
autoTrigger:if not self.hasTakenDamage(withinSeconds=10) and not self.tags(includes="givingShield") or not self.hasTakenDamage(withinSeconds=10) and self.tags(includes="spongeEmpty")
setUnitStats:shieldRegen=2.0
[hiddenAction_shieldRegenOff]
autoTrigger:if self.hasTakenDamage(withinSeconds=10) or self.tags(includes="givingShield")
setUnitStats:shieldRegen=0.2

[hiddenAction_depleteShield]
autoTriggerOnEvent:newMessage(withTag='deplete')
addResources:shield =-50
temporarilyAddTags:givingShield
resetCustomTimer:true
autoTriggerCheckRate:everyFrame

[hiddenAction_shieldEmpty]
autoTrigger:if self.shield()<100
temporarilyAddTags:spongeEmpty
temporarilyRemoveTags:sponge

[hiddenAction_shieldFull]
autoTrigger:if self.shield() >= self.maxShield
temporarilyRemoveTags:spongeEmpty
temporarilyAddTags:sponge


[hiddenAction_removeTag]
autoTrigger:if self.customTimer(laterThanSeconds=5)
temporarilyRemoveTags:givingShield
