
[core]
name: phryn
displayText: Phryn
displayDescription: Oculian Gunship \n-Air unit that specializes against ground units, but can't attack aerial units. \n-Has an Accelerated Energy Feed ability that temporarily buffs firerate. \n-1x Pixie (53 DPS 200 Range) \n-2x Fouette (80 DPS 200 range)\n-2x Pirouette (40 DPS 200 range)
class: CustomUnitMetadata
price: 3000
maxHp: 800
maxShield: 200
shieldRegen: 0.1
mass: 6000
techLevel: 2
buildSpeed: 20s
radius: 16
isBio: false
softCollisionOnAll: 2
fogOfWarSightRange: 20
tags: air, shield
transportSlotsNeeded: 2



[graphics]
total_frames: 1
image: phryn.png
image_wreak: phryn_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 200
shootDelay: 0.5s
isFixedFiring: true



[action_buff]
iconImage:ROOT:\shared\graphics\ammo_feeder.png
text: Accelerated Energy Feed
description: -Increases firerate by 50% for 5 seconds. \n-15s Cooldown
buildSpeed: 1s
addActionCooldownTime: 15s
playSoundAtUnit: ROOT:sounds\Oculian_Armada\ocua_energy_feeder.wav
convertTo: phryn_buff



[hiddenAction_stopflee]
autoTrigger: if self.tags(includes='flee') and not self.tags(includes='retreat') and self.shield(greaterThan=250)
temporarilyRemoveTags: flee



[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=400) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat



[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false



[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat



