[core]
name: fg_ball
copyFrom:ROOT:Templates\customEffects.template

displayText: ball
displayDescription: - Funny zap ball
displayText_ru: Шар
displayDescription_ru: - Смешной шар
class: CustomUnitMetadata
price: 0
maxHp: 67
mass: 91


techLevel: 1
buildSpeed: 2s
#availableInDemo: true

radius: 16
#displayRadius: 25
showInEditor:false

showOnMinimap:false
isBuilding: false
isBio: false
hideScorchMark: true
explodeOnDeath: false
numBitsOnDeath: 0
effectOnDeath: NONE
ignoreInUnitCapCalculation: true
isUnrepairableUnit: true
isUnselectable:true
canNotBeGivenOrdersByPlayer:true
canNotBeDirectlyAttacked:true
disableAllUnitCollisions: true

energyMax: 30
energyRegen: -0.1
energyNeedsToRechargeToFull: true
dieOnZeroEnergy:true

tags: spawn, chainB

[graphics]
total_frames: 1

image:        ROOT:shared/graphics/fg_proj2.png
image_wreak:  NONE
image_turret: NONE
#scaleTurretImagesTo: 20
icon_zoomed_out_neverShow:true
teamColorsOnTurret: true
showEnergyBar:true
scaleImagesTo: 12
#scaleTurretImagesTo: 9

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

maxAttackRange: 125
shootDelay: 20

turretMultiTargeting:true

[hiddenAction_boom]
autoTrigger:true
buildSpeed: 0.2s
fireTurretXAtGround: selfDamage
fireTurretXAtGround_withOffset: 0,10

[hiddenAction_movement]
autoTriggerOnEvent:created
buildSpeed: 0.1s
addWaypoint_type:move
#move range
addWaypoint_position_relativeOffsetFromSelf:0,400

[turret_selfDamage]
x: 0
y: 0
invisible: true
turnSpeed:10
canAttackMaxAngle:181
canShoot:false
projectile:self
shoot_sound:ROOT:sounds\static.wav
shoot_sound_vol: 0.35
[turret_Base]
#body
x: 0
y: 0
invisible: true

turnSpeed: 0.5
turnSpeedAcceleration: 10

canShoot: false

[turret_1]

invisible: true
x: 0
y: 0
idleDir:0
limitingAngle:26
limitingMinRange:25
projectile: 1

attachedTo:Base
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: true

shoot_sound: lighting_burst
shoot_sound_vol: 0.1
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

chargeEffectImage: SHARED:lighting_charge.png

[turret_2]
@copyFromSection:turret_1
idleDir:45


[turret_3]
@copyFromSection:turret_1
idleDir:90


[turret_4]
@copyFromSection:turret_1
idleDir:135


[turret_5]
@copyFromSection:turret_1
idleDir:180


[turret_6]
@copyFromSection:turret_1
idleDir:225


[turret_7]
@copyFromSection:turret_1
idleDir:270


[turret_8]
@copyFromSection:turret_1
idleDir:315


[projectile_1]
directDamage: 35
life: 25
instant: true
lightingEffect: true
largeHitEffect: true

buildingDamageMultiplier:0.25
shieldDamageMultiplier: 1.3

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[projectile_self]
#alwaysVisibleInFog:true

life: 60
speed: 20
hitSound: true
moveWithParent:true

targetGround:true
targetGroundSpread: 0
largeHitEffect: false
deflectionPower: 1
targetGround_includeTargetHeight:true
targetGroundHeightOffset:4

#-------------------------damage
areaDamage: 50
areaRadius: 70
areaDamageNoFalloff:true
#--------------------------
hullDamageMultiplier: 1
buildingDamageMultiplier:0.25
shieldDamageMultiplier: 1.3
armourIgnoreAmount: 0
#------------------------------

invisible:true
drawSize: 0.7

trailEffect: CUSTOM:sparks*1, CUSTOM:projectileTrail
trailEffectRate: 0.5

lightColor: #ccffff
lightSize: 0.55

explodeEffect: CUSTOM:lightningShock, CUSTOM:hitLightFlash, CUSTOM:sparks2*4, fulgor_explosion
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash, CUSTOM:sparks2*4, fulgor_explosion

lightCastOnGround: true

[movement]
movementType: air
moveSpeed: 1.0
moveDecelerationSpeed: 0

targetHeight:5
targetHeightDrift: 2.0

maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :true
moveIgnoringBody:true
