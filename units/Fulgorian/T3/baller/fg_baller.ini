[core]
name: fg_baller
copyFrom:ROOT:Templates\customEffects.template

class: CustomUnitMetadata
price: credits=5500, holmium=275
maxHp: 3000
maxShield: 1000
shieldRegen: 0.15
armour:8
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15
mass: 4000

displayText: Baller (AC)
displayDescription: -Powerfull fulgorian walker which shoots an orb lightning, that zaps all units nearby and does aoe damage where it flies\n-has 8s reload time, equipped with secondary blasters\n-Can cross cliffs, blasters can shoot air, main gun is land attack\n-30% more shield damage. reduced building damage

displayText_ru: Баллер (ПС)
displayDescription_ru: -Мощный Фульгорский юнит что стреляет шаровой молнией, она бьёт током всех ближайших противников и наносит АОЕ урон где пролетает\n-Перезарядка 8с, имеет вторичные бластеры\n-Ходит по горам, бластеры стреляют по воздуху, Основное оружие стреляет по земле\n-30% Больше урона по щитам, Уменьшенный урон по строениям

techLevel: 3
buildSpeed: 60.0s
#availableInDemo: true

radius: 18
displayRadius: 18

fogOfWarSightRange: 28


[graphics]
total_frames: 1

image:        baller.png
image_wreak:  baller_wreck.png
image_turret: baller_turret.png
teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:3
shadowOffsetY:3

dustEffect: true


[attack]
