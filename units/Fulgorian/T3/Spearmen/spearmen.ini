[core]

name: spearmen
class: CustomUnitMetadata
price: credits=2000, holmium=100
mass: 5000

buildSpeed: 23.0s
maxHp: 1400
maxShield: 400
armour:2

shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 20

displayText: Spearmen (B)
displayDescription: - Crawler Evolution\n- Fires pulse plasma lasers at ground targets\n- Relatively durable and can walk over cliffs\n-Slightly more range than other faction counterparts

displayText_ru: Копейщик (Б)
