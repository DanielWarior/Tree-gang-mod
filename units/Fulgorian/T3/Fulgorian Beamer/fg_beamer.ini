[core]
name: fg_beamer
class: CustomUnitMetadata
price: credits=2500, holmium=125
maxHp: 400
armour:2
maxShield: 1000
shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: false
shieldRenderRadius: 25
mass: 3000

energyMax:6
energyNeedsToRechargeToFull:true
energyRegen:0.015
energyRegenWhenRecharging:0.02

displayText: Beamer (S)
displayDescription: - Fires a constant beam at the enemy\n - Beam explodes after sustained fire, dealing large damage\n - Equipped with two burst blasters on the sides\n- All weapons only target ground\n-Reduced building Damage

displayText_ru: Лучевик (С)
displayDescription_ru: - Стреляет постоянным лучом по цели \n-Луч взрывается после продолжительного огня, нанося большой урон\n-Вооружен двумя залповыми бластерами\n-Всё оружие стреляет только по земле\n-Уменьшенный урон по зданиям



techLevel: 3
buildSpeed: 29s
availableInDemo: false
transportSlotsNeeded: 2

radius: 18
displayRadius: 22
softCollisionOnAll: 10

fogOfWarSightRange: 20

#Imports kiting behaviour and custom effects
copyFrom:ROOT:Templates\kiting.template, ROOT:Templates\customEffects.template
[graphics]
total_frames: 1
image: ROOT:shared/graphics/blank.png
image_wreak: fg_beamer_dead.png
image_turret: fg_beamer.png

teamColorsOnTurret: true
showEnergyBar: false

image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false

isFixedFiring: true
aimOffsetSpread: 0

turretSize: 5
turretTurnSpeed: 5
maxAttackRange: 300
shootDelay: 5

[turret_1]
x: 23
y: 0
idleDir:0
projectile: 3
attachedTo: beam
slave: true
turnSpeed: 0
turnSpeedAcceleration: 0
energyUsage:0.25

shoot_sound: plasma_fire
shoot_sound_vol: 0.1
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

delay: 0.25s

image: fg_beamer_gunR.png
chargeEffectImage: SHARED:lighting_charge.png

recoilOffset: -1.5
recoilOutTime: 5
recoilReturnTime: 20
canAttackMaxAngle: 35

[turret_2]
copyFrom: 1
x: -23
y: 0
idleDir:0
projectile: 3
attachedTo: beam
slave: true
image: fg_beamer_gunL.png

[turret_beam]
x: 0
y: 0
barrelY: 12
idleDir:0
projectile: 1
canAttackMaxAngle: 15
turnSpeed: 0
turnSpeedAcceleration: 0

shoot_flame: none
shoot_light: #FFcceeee

[turret_overload]
x: 0
y: 10
invisible: true
projectile: 2
canAttackMaxAngle: 15
turnSpeed: 0
turnSpeedAcceleration: 0
warmup: 2s
delay:1s
shoot_sound: lighting_burst
shoot_sound_vol: 0.1
shoot_light: #FFcceeee

chargeEffectImage: SHARED:lighting_charge.png

[projectile_1]
# Beam
directDamage: 3
deflectionPower: -1
life: 15
instant: true
instantReuseLast: true
beamImage: SHARED:beam3.png
beamImageEnd: SHARED:beam1_end.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #ccffff
lightSize: 0.2
hullDamageMultiplier: 1
shieldDamageMultiplier: 1
buildingDamageMultiplier: 0.5
armourIgnoreAmount: 10
sweepOffset: 3
sweepSpeed: 5

[projectile_2]
# Overload effect
instant:true
directDamage: 150
areaDamage:50
areaRadius:40
shieldDamageMultiplier: 1
buildingDamageMultiplier: 0.5
armourIgnoreAmount: 10
life: 25
speed: 20
largeHitEffect: true
lightColor: #00f2ff
lightSize: 2
color:#00f2ff
beamImage: ROOT:shared/graphics/napalm_beam.png
beamImageEnd: SHARED:beam1_end.png
beamImageOffsetRate:1
explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash
tags: INFShockt2
drawSize:4

[projectile_3]
# Blasters
directDamage: 15
life: 55
speed: 15
image: ROOT:shared/graphics/fg_proj1.png
drawSize: 0.8
lightColor: #ccffff
lightSize: 0.55
buildingDamageMultiplier: 0.5
explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
