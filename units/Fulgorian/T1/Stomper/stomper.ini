[core]
copyFrom:ROOT:Templates\customEffects.template
name: stomper
class: CustomUnitMetadata
price: 1000
mass: 2000
maxHp: 400
maxShield: 300
armour:2
shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15

displayText: Stomper
displayDescription:-Anti swarm fulgorian walker\n-Armed with a thunder shotgun, which becomes more effective the closer you are\n-ground attack\n-Reduced building damage
displayText_ru: Фульгорский шагоход
displayDescription_ru:-Фульгорский шагоход против скоплений юнитов\n-Вооружен громовым дробовиком, что эффективнее вблизи\n-Наземная атака\n-Уменьшенный урон по зданиям
techLevel: 1
buildSpeed: 14s

#transportUnitsRequireTag:size1

radius: 14
softCollisionOnAll: 15

fogOfWarSightRange: 12

[graphics]

image:        stomper.png
image_wreak:  stomper_wreck.png
image_turret: stomper_gun.png

teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
turretRotateWithBody: true

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 1.5
turretTurnSpeed: 0.8
maxAttackRange: 110

[turret_0]
x: 0
y: 11
idleDir:0
projectile: 1
invisible: true
canShoot: false

[turret_1]
x: 0
y: 2
idleDir:0
projectile: dummy
attachedTo: 0
slave: true
canAttackMaxAngle: 20
delay: 30

recoilOffset: -2
recoilOutTime: 5
recoilReturnTime: 10

warmup: 15
chargeEffectImage: SHARED:lighting_charge.png

shoot_sound: ROOT:sounds\lightning_shotgun_fire_1.wav
shoot_sound_vol: 0.5
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

[projectile_1]
directDamage:5
areaDamage:10
areaRadius:30
areaDamageNoFalloff:true

turnSpeed:0
retargetingInFlight:true
retargetingInFlightSearchDelay:5
retargetingInFlightSearchRange:25
retargetingInFlightSearchLead:0

life: 20
speed: 8
speedSpread:0.6
buildingDamageMultiplier:0.5
image:ROOT:shared/graphics/fg_proj5.png

lightSize:0.5
lightColor:#ccffff

drawSize: 0.5
explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*2
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[projectile_dummy]
life: 1

directDamage: 0
areaDamage: 0
areaRadius: 0

speed: 1
instant: false

invisible: true
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false
spawnProjectilesOnCreate:1*12(offsetRandomDir=30)

[leg_1]
x: 12
y: 0
attach_x: 10
attach_y: -3
moveSpeed: 1.8
heightSpeed: 1
moveWarmUp:3
resetAngle: 15
dust_effect: false
holdDisMin: 6
holdDisMax: 12
holdDisMin_maxMovingLegs: 1
estimatingPositionMultiplier: 0.33
image_leg: fg_walker_leg.png
image_foot: fg_walker_foot.png
image_foot_shadow: SHADOW:fg_walker_foot.png
draw_foot_on_top: false
holdDisMin_checkNeighbours:true

targetHeight:-2
endDirOffset:0
rotateSpeed:3
[leg_2]
@copyFromSection: leg_1
x: -12
y: 0
attach_x: -10
attach_y: -3

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.07

#reverseSpeedPercentage: 1
targetHeight: 3
targetHeightDrift: 0
startingHeightOffset: 0

maxTurnSpeed: 4
turnAcceleration: 0.1

moveSlidingMode: true
moveIgnoringBody: true

[ai]
useAsTransport:true

