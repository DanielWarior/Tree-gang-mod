animation_moving_speed: 2


[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 15
maxAttackRange: 260
shootDelay: 20

[turret_1]
x: 4
y: 0
attachedTo: base
slave: true
shoot_sound:missile_fire
shoot_sound_vol: 0.35
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee
canAttackMaxAngle:30 
projectile: 1
size: 4
energyUsage: 1
image: catcher_gun_barrel.png
recoilOffset: -2
recoilOutTime: 5
recoilReturnTime: 10

[turret_2]
linkDelayWithTurret:1
x: -4
y: 0
copyFrom: 1
warmup: 10

[turret_base]
x: 0
y: -6
canShoot: false
turnSpeed: 8

[projectile_1]
life: 200
speed: 6
drawSize: 0.8
targetSpeed: 15
targetSpeedAcceleration:0.3
trailEffect: CUSTOM:ripple, CUSTOM:sparks*1, CUSTOM:projectileTrail
trailEffectRate:1
largeHitEffect: true

mutator1_ifUnitWithTags:missile
mutator1_areaDamageMultiplier:0.4
#wobbleAmplitude: 3
#wobbleFrequency: 2

ballistic: false
