targetGround_includeTargetHeight: true

image: ROOT:shared/graphics/fg_proj2.png
lightColor: #ccffff
lightSize: 0.4
explodeEffect: CUSTOM:lightningShock, CUSTOM:hitLightFlash
explodeEffectOnShield: CUSTOM:hitLightFlash, lightningShock

[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.07
