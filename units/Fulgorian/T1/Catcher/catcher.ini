
[core]
copyFrom:ROOT:Templates\customEffects.template
name: catcher
class: CustomUnitMetadata
price: 900
mass: 2000
maxHp: 400
maxShield: 200
shieldRegen: 0.1
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15

energyMax: 8
energyNeedsToRechargeToFull:true
energyRegen:0.020
energyRegenWhenRecharging:0.05

displayText: Catcher (AA)
displayDescription:- A anti air vehicle\n- Fires AoE flak at air targets \n-Reduced damage to missiles

displayText_ru: Ловчий (ПВО)
displayDescription_ru: Противо-воздушная машина\n- Стреляет зенитными снарядами по воздушным целям\n-Уменьшенный урон по ракетам

techLevel: 1
buildSpeed: 10s

radius: 15
softCollisionOnAll: 10

fogOfWarSightRange: 14

[graphics]
total_frames: 3	

image:        catcher.png
image_wreak:  catcher_wreck.png
image_turret: catcher_gun_base.png
teamColorsOnTurret:true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
