
[core]
copyFrom:ROOT:Templates\customEffects.template
name: carrier
class: CustomUnitMetadata
price: 900
mass: 2000
maxHp: 300
maxShield: 200
shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15

displayText: Carrier (T)
displayDescription:- Can transport 4 small sized units\n- Weak ground and air attack \n- Can move over water
displayText_ru: Носитель (Т)
displayDescription_ru:- Может перевозить 4 небольшие единицы\n- Слабая атака по наземным и воздушным целям\n- Может передвигаться над водой
techLevel: 1
buildSpeed: 10s

#transportUnitsRequireTag:size1
transportUnitsCanUnloadUnits: true
maxTransportingUnits: 4
transportUnitsKillOnDeath: True
transportUnitsRequireMovementType: LAND,OVER_CLIFF,HOVER

radius: 30
displayRadius:35
softCollisionOnAll: 25

fogOfWarSightRange: 11

[graphics]

image:        fg_carrier.png
image_wreak:  fg_carrier_wreck.png
image_turret: fg_carrier_turret.png

teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 15
turretTurnSpeed: 3
maxAttackRange: 150



[turret_1]
x: 0
y: 5
image:fg_carrier_barrel.png
idleDir:0
projectile: 1
attachedTo: 0
slave: true
canAttackMaxAngle: 20
turnSpeed: 1
turnSpeedAcceleration: 0
delay: 0.5s

shoot_sound: plasma_fire
shoot_sound_vol: 0.1
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

[turret_0]
x: 0
y: 8
idleDir:0
projectile: 1
canShoot: false

[projectile_1]
directDamage: 12
life: 55
speed: 20
image: ROOT:shared/graphics/fg_proj1.png
drawSize: 0.8
lightColor: #ccffff
lightSize: 0.5

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*2
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash


[effect_hitLightFlash]
priority: high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 0.8
scaleTo: 0.8
alpha: 0.6
drawUnderUnits: false

[movement]
movementType: HOVER
moveSpeed: 1.5
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.01

targetHeight: 3
targetHeightDrift: 1

maxTurnSpeed: 3
turnAcceleration: 0.1

moveSlidingMode: true
moveIgnoringBody: true
moveSlidingDir: 181

[ai]
useAsTransport:true
