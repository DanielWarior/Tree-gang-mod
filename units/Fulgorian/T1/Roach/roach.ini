[core]
copyFrom:ROOT:Templates\customEffects.template
name: roach
class: CustomUnitMetadata

price: 900
maxHp: 450
mass: 500


displayText: Roach (S)
displayDescription: - Fulgorian skirmisher crawler\n- Shoots orb lightning in an arc\n-Land attack
displayText_ru: Таракан (С)
displayDescription_ru: - Фулгорский шагаход стрелок\n- Стреляет шаровыми молниями по дуге\n-Наземная атака
techLevel: 1
buildSpeed: 8.5s
availableInDemo: false

radius: 14
displayRadius: 16
softCollisionOnAll: 7

fogOfWarSightRange: 13

[graphics]
total_frames: 1
image:roach.png
#image: ROOT:shared/graphics/blank.png

image_wreak: roach_wreck.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 5
turretTurnSpeed: 7
maxAttackRange: 180
shootDelay: 160

[turret_1]
x: 0
y: -8
idleDir:0
projectile: 1

turnSpeed: 0
turnSpeedAcceleration: 0

shoot_sound: ROOT:sounds\lighting_shot.wav
shoot_sound_vol: 0.15
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee
canAttackMaxAngle:45
canShoot: true
warmup: 30
chargeEffectImage: SHARED:lighting_charge.png

#recoilOffset: -1.5
#recoilOutTime: 3
#recoilReturnTime: 17

[projectile_1]
life: 150
speed: 5
invisible:true
drawSize: 1

image: ROOT:shared/graphics/fg_proj2.png

initialUnguidedSpeedHeight: 1.5
gravity:0.10

directDamage:60
areaDamage:40
areaRadius:30

lightColor: #ccffff
lightSize: 0.55

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8, CUSTOM:sparks2*4
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash, CUSTOM:sparks2*4

[leg_1]
