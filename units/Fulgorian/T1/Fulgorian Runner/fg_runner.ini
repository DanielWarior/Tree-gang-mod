
[core]
overrideAndReplace:scout
 
name: fg_runner
class: CustomUnitMetadata
price: 400
maxHp: 50
mass: 10
selfRegenRate:0.01

displayText: Fulgorian Vault Runner
displayDescription:- A super fast scout unit\n- VERY fragile and can barely attack\n- Leaves its wreck for a while after death which still has vision\n-Can see mines and cloaked units
techLevel: 1
buildSpeed: 5s
tags:radar
#availableInDemo: false

radius: 10
#displayRadius: 11
softCollisionOnAll: 24

fogOfWarSightRange: 20

@memory electricGun: number
#memory is for turret animation

#Following actions are for animated turret
[hiddenAction_animTurret]
#changing the memory will change how long the ON animation lasts
setUnitMemory:electricGun = 1.0
[hiddenAction_animElectricActive]
#changing the seconds will change how often the memory ticks down
autoTrigger:if self.customTimer(laterThanSeconds=0.08)
setUnitMemory: electricGun = select(memory.electricGun > 0, memory.electricGun -1, memory.electricGun)
resetCustomTimer:true
[graphics]
total_frames: 5

image:        fg_runner_New.png
image_wreak:  fg_runner_dead.png
image_turret: NONE
#scaleImagesTo: 10
#scaleTurretImagesTo: 2

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed:5

animation_moving_start: 1
animation_moving_end: 4
animation_moving_speed: 5


lock_body_rotation_with_main_turret: true

[attack]
turretRotateWithBody: true

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 6
turretTurnSpeed: 4
maxAttackRange: 100
shootDelay: 10


isFixedFiring: true

[hiddenAction_beacon]
autoTriggerOnEvent: destroyed
spawnUnits: fg_runner_dead

[turret_1]
x: 0
y: 11
idleDir:0
shoot_sound: plasma_fire
shoot_sound_vol:0.1
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false 
projectile: 1
size: 5
turnSpeedAcceleration: 0.2

delay: 20

image: NONE
onShoot_triggerActions:animTurret

[decal_electricTurret]
order:1
onlyWhileAlive:true
basePositionFromTurret: 1
imageScale:0.75
total_frames:2
image:fg_gun1_New.png
frame: select(memory.electricGun > 0, 1, 0)
layer:beforeBody

[projectile_1]
directDamage: 5
life: 60
buildingDamageMultiplier:0.2
image: ROOT:shared/graphics/fg_proj1.png
drawSize: 0.60 
lightColor: #ccffff

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[effect_hitLightFlash]
priority: high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits: false

[effect_lightningShock]
scaleFrom: 0.5
scaleTo: 0.5
life: 60
hOffset: 0
dirOffset: 0
fadeInTime: 0
fadeOut: false
attachedToUnit: true
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5

[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.6
ySpeedRelativeRandom: 1.6
hSpeed: 2
image: SHARED:spark.png
priority: verylow

[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

[movement]
movementType: HOVER
moveSpeed: 3.5
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1

reverseSpeedPercentage:0

maxTurnSpeed: 5
turnAcceleration: 0.2

moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181

[ai]
disableUse:true
buildPriority: 0.30
maxEachBase: 2