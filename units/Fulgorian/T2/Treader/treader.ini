
[core]
copyFrom:ROOT:Templates\customEffects.template
name: treader

displayText: Treader (B)
displayDescription: -Advanced tank-like construct of fulgora \n-ground and weak air attack

displayText_ru:Наступатель (Б)
displayDescription_ru: -Продвинутый танко-подобный конструкт Фулгоры \n-наземная и слабая воздушная атака атака

class: CustomUnitMetadata
price: 1100
maxHp: 1400
armour:4
mass: 2000

techLevel: 2
buildSpeed: 14s
#availableInDemo: true

radius: 20
displayRadius: 25

fogOfWarSightRange: 15

isBio: false
softCollisionOnAll: 0

[graphics]
total_frames: 6

teamColorsOnTurret: true
image:        treader.png
image_wreak:  treader_wreck.png
image_turret: treader_turret_base.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 5
animation_moving_speed: 2


dustEffect: true

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=200) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 3


maxAttackRange: 200
shootDelay: 180
turretMultiTargeting:true

[turret_2]
#
x: 0
y: 6
image:treader_turret_barrel.png
attachedTo:1
slave:true

warmup:20
chargeEffectImage: SHARED:lighting_charge.png
projectile: 1

recoilOffset: -8
recoilReturnTime: 2.00s

turnSpeed: 3
barrelY: 30

canShoot: true
aimOffsetSpread:0.2
shoot_sound: ROOT:sounds\lighting_shot2.wav
shoot_sound_vol: 0.6
shoot_flame: CUSTOM:sparks2*3,fulgorFireSmall
shoot_light: #FFcceeee

canAttackFlyingUnits: false
canAttackLandUnits:   true


[turret_1]
x: 0
y: 0
projectile: 1
canShoot:false
canAttackFlyingUnits: false
canAttackLandUnits:   true

[turret_3]
#
x: 5
y: 1

image:treader_turret_2.png

attachedTo:1

projectile: 2

turnSpeed: 6
barrelY: 6

canShoot: true
aimOffsetSpread:0.2

delay:12
shoot_sound: ROOT:sounds\static.wav
shoot_sound_vol: 0.25
shoot_flame: CUSTOM:fulgorFireSmall
shoot_light: #FFcceeee

canAttackFlyingUnits: true
canAttackLandUnits:   false

[projectile_1]
directDamage: 200
areaDamage:50
areaRadius:25

life: 25
speed:10
largeHitEffect: true

image: ROOT:shared/graphics/fg_proj1.png

drawSize:1.0

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[projectile_2]
directDamage: 10
life: 25

instant: true
instantReuseLast:true
largeHitEffect: true

sweepOffset:3
sweepSpeed:1

beamImageStart:SHARED:beam1_start.png
beamImage: ROOT:shared/graphics/laserTiny.png

color:#00fff2
explodeEffect: CUSTOM:sparks*1
explodeEffectOnShield: CUSTOM:sparks*1
moveWithParent:true
[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.15
moveDecelerationSpeed: 0.2
reverseSpeedPercentage:0.9

maxTurnSpeed: 3.0
turnAcceleration: 0.55

moveSlidingMode :false
moveIgnoringBody:false

[ai]
buildPriority:0.7