[core]
name: skirmisher
class: CustomUnitMetadata
price: credits=1700
maxHp: 600
maxShield: 200
shieldRegen: 0.12
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: false
shieldRenderRadius: 18
mass: 3000

displayText: Skirmisher (S)
displayDescription: 

displayText_ru: Стрелок (С)
displayDescription_ru:


techLevel: 2
buildSpeed: 19s
availableInDemo: false
transportSlotsNeeded: 2

radius: 14
displayRadius: 18
softCollisionOnAll: 4

fogOfWarSightRange: 20

#Imports kiting behaviour and custom effects
copyFrom:ROOT:Templates\kiting.template, ROOT:Templates\customEffects.template

[graphics]
total_frames: 1
image: skirmisher.png
image_wreak: skirmisher_wreck.png
image_turret: NONE

teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false

isFixedFiring: true
aimOffsetSpread: 0

turretSize: 5
turretTurnSpeed: 5
maxAttackRange: 270
shootDelay: 3

[turret_1]
x: 0
y: 5
idleDir:0
projectile: 1

turnSpeed: 1

size:10

warmup:2

shoot_sound: ROOT:sounds\static_laser_fire_1.wav
shoot_sound_vol: 0.08
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

chargeEffectImage: SHARED:lighting_charge.png

invisible:true

recoilOffset: -1.5
recoilOutTime: 5
recoilReturnTime: 20
canAttackMaxAngle: 35

[projectile_1]
# Beam
directDamage: 8
deflectionPower: -1
life: 15
instant: true
instantReuseLast: true
beamImage: SHARED:beam3.png
beamImageEnd: SHARED:beam1_end.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #ccffff
lightSize: 0.2
hullDamageMultiplier: 1
shieldDamageMultiplier: 1
buildingDamageMultiplier: 0.5
armourIgnoreAmount: 10
sweepOffset: 3
sweepSpeed: 5

[leg_1]
x: -8
y: 0
attach_x: -8
attach_y: 0
heightSpeed: 0.8
moveSpeed: 2.5
rotateSpeed:5

image_leg: skirmisher_leg.png
image_end: skirmisher_foot.png
dust_effect: false
holdDisMin: 18
holdDisMax: 32
holdDisMin_maxMovingLegs: 2
estimatingPositionMultiplier: 1
draw_foot_on_top:false
hidden:if self.hasParent()

[leg_2]
@copyFromSection: leg_1
x: 8
y: 0
attach_x: 8
attach_y: 0
draw_foot_on_top:true

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.08

maxTurnSpeed: 2
turnAcceleration: 0.5

moveSlidingMode: false
moveIgnoringBody: true
moveSlidingDir: 181

slowDeathFallSmoke: true

