
[core]
name: fg_Repulsor
class: CustomUnitMetadata
price: 1150
maxHp: 530
mass: 1780

displayText: Repulsor
displayDescription: - Fast raiding and assault craft\n-Inaccurate burst fire attack, can hit air and ground\n-Repulsion armour reduces incoming damage\n-Also pushes nearby enemy units away
displayText_ru: 
displayDescription_ru: 
techLevel: 2

buildSpeed: 16s
availableInDemo: true

radius: 18
displayRadius: 20

fogOfWarSightRange: 16
energyMax: 1
energyRegen: 0.0002
energyNeedsToRechargeToFull: true

#The "Repulsion Armour" concept is basically a small extremely rapidly regenerating shield 
maxShield: 25
shieldRegen: 15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15
@memory electricGun: number
[hiddenAction_Repulse]
autoTrigger:if self.customTimer(laterThanSeconds=0.5) and self.hasFlag(id=11)
fireTurretXAtGround:4
fireTurretXAtGround_withOffset:0,0
resetCustomTimer:true
[action_Activate Repulsor]
buildSpeed:1
text:Activate Repulsor
description:Turns on a Repulsion field that pushes light units away\n-Lasts 6s
isActive:if not self.hasFlag(id=11)
allowMultipleInQueue:false
addResources:setFlag=11
addActionCooldownTime:30s
alsoQueueAction:DeactivateRepulsor
[hiddenAction_DeactivateRepulsor]
buildSpeed:6s
addResources:unsetFlag=11

[graphics]
total_frames: 4
image_shield:shield.png
showShieldBar:false
image:        fg_Repulsor.png
image_wreak:  fg_Siphon_dead.png
image_turret: ROOT:shared/graphics/blank.png
#scaleImagesTo: 28
#scaleTurretImagesTo: 20
#teamColorsOnTurret:true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
scaleImagesTo: 35
animation_idle_start: 0
animation_idle_end: 1
animation_idle_pingPong:false
animation_idle_speed: 5

animation_moving_start: 2
animation_moving_end: 3
animation_moving_pingPong:false
animation_moving_speed: 5

dustEffect: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
maxAttackRange: 210
shootDelay: 180
turretMultiTargeting:true

[turret_1]
x: 0
y: -5
projectile: 1
barrelY: 9
onShoot_triggerActions:animTurret
[turret_2]
x:0
y:-5
copyFrom:1
warmup:5
linkDelayWithTurret:1
[turret_3]
x:0
y:-5
copyFrom:1
warmup:10
linkDelayWithTurret:1
[projectile_1]
areaDamage:150
areaRadius:20
life: 60
speed:7
image: ROOT:shared/graphics/fg_proj1.png
drawSize: 0.60 
lightColor: #ccffff
targetGround:true
targetGroundSpread:30
targetGround_includeTargetHeight:true
explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*8
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash
[turret_4]
x:0
y:0
canShoot:false
projectile:2
shoot_flame:CUSTOM:Repulse
[projectile_2]
areaDamage:0
areaRadius:200
life: 60
instant:true
image: NONE
drawSize: 1
areaHitAirAndLandAtSameTime:true
areaRadiusFromEdge:true
targetGround:true
targetGroundSpread:0
targetGround_includeTargetHeight:true
explodeEffect: NONE
pushForce:1000
pushVelocity:1
[effect_Repulse]
priority: critical
image: repulse.png
life: 30
fadeInTime:10
fadeOut: true
attachedToUnit: true
scaleFrom: 1.5
scaleTo: 3.5
alpha: 0.6
dirOffsetRandom:180
drawUnderUnits: false
[effect_hitLightFlash]
priority: high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.3
drawUnderUnits: false

[effect_lightningShock]
scaleFrom: 0.5
scaleTo: 0.5
life: 60
hOffset: 0
dirOffset: 0
fadeInTime: 0
fadeOut: false
attachedToUnit: true
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5

[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.6
ySpeedRelativeRandom: 1.6
hSpeed: 2
image: SHARED:spark.png
priority: verylow

[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

#Following actions are for animated turret
[hiddenAction_animTurret]
setUnitMemory:electricGun = 3
[hiddenAction_animElectricActive]
autoTrigger:true
setUnitMemory: electricGun = select(memory.electricGun > 0, memory.electricGun -1, memory.electricGun)
[decal_electricTurret]
order:1
onlyWhileAlive:true
#basePositionFromTurret:5
basePositionFromTurret: 1
imageScale:0.6
total_frames:3
image:gun_anim.png
frame: select(memory.electricGun > 0, self.timeAlive*100%3, 0)
layer:AfterBody

[movement]
movementType: LAND
moveSpeed: 2.6
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.07

maxTurnSpeed: 2.5
turnAcceleration: 0.3

moveSlidingMode :true
moveIgnoringBody:true
