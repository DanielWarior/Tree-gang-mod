[core]
copyFrom:ROOT:Templates\customEffects.template
name: ripper
class: CustomUnitMetadata
price: 2000
mass: 2000
maxHp: 300
maxShield: 1000
shieldRegen: 0.2
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15

displayText: Ripper (R)
displayDescription:-Fulgorian minigun walker\n-Armed with dual miniguns, which need to warm up to get their maximum firerate\n-ground attack and weaker air attack
displayText_ru: Разрыватель (Р)
displayDescription_ru:-Фульгорский миниган шагоход\n-Вооружен двумя миниганами, что должны разогрется для достижения максимальной скорострельности\n-Наземная атака и ослабленная воздушная атака
techLevel: 2
buildSpeed: 17s

#transportUnitsRequireTag:size1

radius: 18
softCollisionOnAll: 15

fogOfWarSightRange: 12

[graphics]

image:        ripper.png
image_wreak:  ripper_wreck.png
image_turret: ripper_gun.png

teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
turretRotateWithBody: true

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 1.5
turretTurnSpeed: 5
maxAttackRange: 180
shootDelay:35
aimOffsetSpread:0.1

[turret_1]
x: 16
y: 14

image:ripper_gun.png
invisible:false
projectile: 1
canAttackMaxAngle: 45

recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 10

shoot_sound: plasma_fire
shoot_sound_vol: 0.2
shoot_flame: CUSTOM:sparks2*3,fulgorFireSmall
shoot_light: #FFcceeee

warmup:180
warmupCallDownRate:0.35
warmupNoReset:true
warmupShootDelayTransfer:25

canAttackLandUnits: true
canAttackFlyingUnits: false

[turret_2]
x: -16
y: 14

image:ripper_gun.png
invisible:false
projectile: 1
canAttackMaxAngle: 45

recoilOffset: -3
recoilOutTime: 6
recoilReturnTime: 10

shoot_sound: plasma_fire
shoot_sound_vol: 0.2
shoot_flame: CUSTOM:sparks2*3,fulgorFireSmall
shoot_light: #FFcceeee

delay:60
warmup:5
linkDelayWithTurret:1

canAttackLandUnits: true
canAttackFlyingUnits: false


[turret_3]
x: 15
y: 13
@copyFromSection:turret_1
invisible:true

warmupNoReset:false
warmup:10

canAttackLandUnits: false
canAttackFlyingUnits: true

[turret_4]
x: -15
y: 13
@copyFromSection:turret_1
invisible:true

warmupNoReset:false
warmup:10

canAttackLandUnits: false
canAttackFlyingUnits: true

[turret_0]
canShoot:false
x: 0
y: 5.5
image:ripper_cover.png


[projectile_1]
directDamage:20

life: 60
speed: 12
speedSpread:0.6
image:ROOT:shared/graphics/fg_proj5.png

lightSize:0.5
lightColor:#ccffff

drawSize: 0.7
explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*2
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[leg_1]
x: 15
y: 0
attach_x: 13
attach_y: -3
moveSpeed: 3.5
heightSpeed: 1
moveWarmUp:3
resetAngle: 15
dust_effect: false
holdDisMin: 6
holdDisMax: 12
holdDisMin_maxMovingLegs: 1
estimatingPositionMultiplier: 0.45
image_leg: fg_walker_leg.png
image_foot: fg_walker_foot.png
image_foot_shadow: SHADOW:fg_walker_foot.png
draw_foot_on_top: false
holdDisMin_checkNeighbours:true

targetHeight:-2
endDirOffset:0
rotateSpeed:8
[leg_2]
@copyFromSection: leg_1
x: -13
y: 0
attach_x: -15
attach_y: -3

[movement]
movementType: LAND
moveSpeed: 1.25
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.07

#reverseSpeedPercentage: 1
targetHeight: 3
targetHeightDrift: 0
startingHeightOffset: 0

maxTurnSpeed: 4
turnAcceleration: 0.2

moveSlidingMode: true
moveIgnoringBody: true

[ai]
useAsTransport:true

