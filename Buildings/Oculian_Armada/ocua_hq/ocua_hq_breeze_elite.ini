
[core]
name: ocua_hq_breeze_elite

showInEditor: false

copyFrom: ROOT:units\Oculian_Armada\Breeze\breeze_elite.ini
ignoreInUnitCapCalculation: true
isUnselectable: true
isUnselectableAsTarget: false
disableAllUnitCollisions: true
autoTriggerCooldownTime: 1s



[hiddenAction_spawned]
autoTriggerOnEvent: created
setCustomTarget1: self.parent
alsoQueueAction: disconnect



[hiddenAction_disconnect]
buildSpeed: 0.5s
disconnectFromParent: true



[hiddenAction_attack]
autoTrigger: if customTarget1.isAttacking() and distanceBetween(self, customTarget1) <= 400
clearAllWaypoints: true
addWaypoint_type: attack
addWaypoint_target_fromReference: customTarget1.attacking
temporarilyAddTags: attacking



[hiddenAction_swarm]
autoTrigger: if self.isAttacking() and self.tags(includes='attacking')
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_target_fromReference: attacking.getOffsetRelative(x=rnd(-100, 100), y=rnd(-100, 100))



[hiddenAction_stopattacking]
autoTrigger: if not customTarget1.isAttacking()
clearAllWaypoints: true
temporarilyRemoveTags: attacking



[hiddenAction_movearound]
autoTrigger: if not self.tags(includes='attacking')
addWaypoint_type: move
addWaypoint_target_fromReference: customTarget1.getOffsetRelative(x=rnd(-200, 200), y=rnd(-200, 200))
clearActiveWaypoint: true



[hiddenAction_die]
autoTrigger: if not customTarget1.tags(includes='alive')
setUnitStats: hp=0



[hiddenAction_death]
autoTriggerOnEvent: destroyed
takeResources: slots=-1
takeResources_includeReference: customTarget1



[resource_slots]
hidden: true