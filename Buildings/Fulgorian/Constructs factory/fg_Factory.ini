
[core]
name: fg_Factory
class: CustomUnitMetadata
displayText: Fulgorian Constructs Factory
displayDescription: Produce T1 land units
displayText_ru: Фульгорский завод техники
displayDescription_ru: Производит Т1 наземную технику
price: 800
maxHp: 1100
mass: 9000
footprint: -1,-2,1,2
constructionFootprint: -1,-2,1,2
techLevel: 1
buildSpeed:10s
radius: 35
isBio: false
isBuilding: true
buildingToFootprintOffsetY:-0
explodeTypeOnDeath: building
exit_x:0
exit_y:25
exit_moveAwayAmount:100
canBuild_1_name: setRally
canBuild_1_pos:  0.1

fogOfWarSightRange: 10

tags: building
[canBuild_ListOrderT1]
name: fg_runner, fg_builder, roller, fg_raider, fg_spit, catcher, fg_scatter, fg_grounder
pos: 3



[action_upgrade]
convertTo: fg_Factory_T2
price: 4000
iconImage: SHARED:icon_upgrade.png
text: Upgrade - T2
description:T2 Fulgorian Factory
text_ru: Улучшение в Т2
description_ru: Т2 фульгорский завод техники
displayType: upgrade
buildSpeed: 70s
pos: 0.2
allowMultipleInQueue:false

isVisible: if numberOfUnitsInTeam(withTag="T2_land") == 0

[action_upgrade_consecutive]
convertTo: fg_Factory_T2
price: 2000
iconImage: SHARED:icon_upgrade.png
text: Upgrade - T2
description:T2 Fulgorian Factory
text_ru: Улучшение в Т2
description_ru: Т2 фульгорский завод техники
displayType: upgrade
buildSpeed: 35s
pos: 0.2
allowMultipleInQueue:false

isVisible: if numberOfUnitsInTeam(withTag="T2_land") > 0


[graphics]
image:        fulgor_mechFactory.png
image_back:   factory_bottom.png
image_wreak:  fulgor_mechFactory_wreck.png

image_shadow: AUTO
shadowOffsetX:1

total_frames: 4

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0



[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1


[animation_idle]
onActions : idle
pingPong: false
KeyframeTimeScale: 0.25
body_0s: {frame:0}
body_0.5s: {frame:1}
body_1.0s: {frame:2}
body_1.5s: {frame:3}


[ai]
buildPriority: 0.50
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.25
ai_upgradePriority:0.8




