[core]

name: light_veh_fac
class: CustomUnitMetadata
maxHp: 1600
price: 800
mass: 1000

displayText: Light Vehicle Factory
displayDescription: -Dominion's Light Vehicle Factory factory \n-produces cars and other vehicles which are faster and cheaper than tanks

displayText_ru: Завод Легкой техники
displayDescription_ru:Завод легкой техники доминиона\n-Производит машины и другую технику что быстрее и дешевле чем танки

radius: 60
displayRadius:60

buildSpeed: 12s

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1

fogOfWarSightRange: 10

isBuilding: true
explodeTypeOnDeath: building

canBuild_1_name: setRally
canBuild_1_pos:  0.1

canBuild_2_name: dominion_builder, recon_vehicle, gladiator, thruster, gladius, discharge, javelin, swatter, mannerwagen
canBuild_2_pos:  3

[graphics]

image: light_veh_fac.png
image_back: light_veh_fac_bottom.png
image_wreak: light_veh_fac_wreck.png

image_shadow: auto
shadowOffsetX:1
shadowOffsetY:1

total_frames: 8

animation_idle_start:0
animation_idle_end:7
animation_idle_speed:6

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[action_upgrade]
text:Upgrade to T2
text_ru:Улучшить до Т2

description:-Upgrading the factory will allow construction of stronger vehicles
description_ru:-Улучшение завода позволит производить более совершенную технику

pos:0.1
isVisible: if numberOfUnitsInTeam(withTag="T2_vehicles") == 0
isLockedMessage: We did not invent this yet
price:3000
buildSpeed:60s
temporarilyAddTags:T2

allowMultipleInQueue:false
iconImage: SHARED:icon_upgrade.png
displayType: upgrade

convertTo: light_veh_fac_t2

[action_upgrade_consecutive]
text:Upgrade to T2
text_ru:Улучшить до Т2

description:-Upgrading the factory will allow construction of stronger vehicles(cheaper and faster due to already existing T2 factory of this type)
description_ru:-Улучшение завода позволит производить более совершенную технику(Быстрее и дешевле из за наличия т2 завода этого типа)

pos:0.1
isVisible: if numberOfUnitsInTeam(withTag="T2_vehicles") > 0
isLockedMessage: We did not invent this yet
price:1500
buildSpeed:30s
temporarilyAddTags:T2

allowMultipleInQueue:false
iconImage: SHARED:icon_upgrade.png
displayType: upgrade
convertTo: light_veh_fac_t2

[arm_1]
x:0
y:0
image_end:light_veh_fac_door.png


[animation_openDoor]

onActions: queuedUnits
onActionsQueuedUnitPlayAt: 0.8

blendIn: 1s
blendOut: 4s

arm1_0: {x:0, y:26}

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
buildPriority: 0.50
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.15
maxEachBase:1
maxGlobal:5
ai_upgradePriority:0.3