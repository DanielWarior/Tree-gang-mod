[core]
name:air_mine
class: CustomUnitMetadata
price: 250
maxHp: 1200
mass: 60
buildSpeed: 8s
effectOnDeath:smallExplosion

tags:air_mine,building

exit_dirOffset:90

displayText: Air-mine
