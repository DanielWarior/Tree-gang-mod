[core]
name:startTimer
class: CustomUnitMetadata
price: 0
maxHp: 1
mass: 0

buildSpeed: 0
radius: 0

showInEditor: false
showOnMinimap: false
ignoreInUnitCapCalculation: true
disableAllUnitCollisions: true
canNotBeDamaged: true
canNotBeDirectlyAttacked: true
isUnselectable: true
hideScorchMark: true
explodeOnDeath: false


[graphics]
image: ROOT:shared/graphics/blank.png
drawLayer: bottom
isVisibleToEnemies: false
icon_zoomed_out_neverShow: true


[attack]
canAttack: false


[movement]
movementType: NONE
moveSpeed: 0
maxTurnSpeed: 0

[hiddenAction_readycheck]
buildSpeed:1s
autoTrigger:if self.globalTeamTags(includes='timerStart')
allowMultipleInQueue:false
alsoQueueAction:startingTimer
removeGlobalTeamTags:timerStart

[hiddenAction_startingTimer]
buildSpeed:1s
requireConditional:if self.teamId() == 0
showMessageToAllPlayers:1
alsoQueueAction:2
allowMultipleInQueue:false

[hiddenAction_2]
buildSpeed:1s
showMessageToAllPlayers:2
alsoQueueAction:3
allowMultipleInQueue:false

[hiddenAction_3]
buildSpeed:1s
showMessageToAllPlayers:3
alsoQueueAction:4
allowMultipleInQueue:false

[hiddenAction_4]
buildSpeed:1s
showMessageToAllPlayers:4
alsoQueueAction:5
allowMultipleInQueue:false

[hiddenAction_5]
buildSpeed:1s
showMessageToAllPlayers:5
alsoQueueAction:6
allowMultipleInQueue:false

[hiddenAction_6]
buildSpeed:1s
showMessageToAllPlayers:6
alsoQueueAction:7
allowMultipleInQueue:false

[hiddenAction_7]
buildSpeed:1s
showMessageToAllPlayers:7
alsoQueueAction:8
allowMultipleInQueue:false

[hiddenAction_8]
buildSpeed:1s
showMessageToAllPlayers:8
alsoQueueAction:9
allowMultipleInQueue:false

[hiddenAction_9]
buildSpeed:1s
showMessageToAllPlayers:9
alsoQueueAction:10
allowMultipleInQueue:false

[hiddenAction_10]
buildSpeed:1s
showMessageToAllPlayers:10
alsoQueueAction:end
allowMultipleInQueue:false
temporarilyAddTags:timerIsEnd

[hiddenAction_end]
addGlobalTeamTags:timerEnd
buildSpeed:1s
showMessageToAllPlayers:Begin!
deleteSelf: true

[hiddenAction_end2]
autoTrigger:if numberOfUnitsInAllTeams(withTag="timerIsEnd") >= 1
addGlobalTeamTags:timerEnd
buildSpeed:3s
deleteSelf: true
requireConditional:if self.teamId() != 0